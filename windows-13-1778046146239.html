<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <title>WinNext OS v14 - Future Edition</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="data:application/json;base64,ewogICJuYW1lIjogIldpbk5leHQgT1MiLAogICJzaG9ydF9uYW1lIjogIldpbk5leHQiLAogICJzdGFydF91cmwiOiAiLiIsCiAgImRpc3BsYXkiOiAic3RhbmRhbG9uZSIsCiAgIm9yaWVudGF0aW9uIjogImxhbmRzY2FwZSIsCiAgImJhY2tncm91bmRfY29sb3IiOiAiIzAwMDAwMCIsCiAgInRoZW1lX2NvbG9yIjogIiMwMDAwMDAiLAogICJpY29ucyI6IFsKICAgIHsKICAgICAgInNyYyI6ICJodHRwczovL2Nkbi1pY29ucy1wbmcuZmxhdGljb24uY29tLzUxMi83MzMvNzMzNjQxLnBuZyIsCiAgICAgICJzaXplcyI6ICI1MTJ4NTEyIiwKICAgICAgInR5cGUiOiAiaW1hZ2UvcG5nIgogICAgfQogIF0KfQ==">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Segoe+UI:wght@300;400;600;700&family=Inter:wght@300;400;500;600;700&display=swap');

        :root {
            --acrylic: rgba(20, 20, 20, 0.6);
            --mica: rgba(30, 30, 30, 0.8);
            --accent: #00a2ed;
        }

        * {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            font-family: 'Segoe UI', 'Inter', sans-serif;
            user-select: none;
            outline: none;
        }

        body {
            margin: 0;
            padding: 0;
            background: #000;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            color: white;
        }

        /* Landscape Enforcement for Mobile */
        @media screen and (orientation: portrait) {
            #orientation-warning {
                display: flex !important;
            }
        }

        .acrylic {
            backdrop-filter: blur(25px) saturate(160%);
            -webkit-backdrop-filter: blur(25px) saturate(160%);
            background: var(--acrylic);
        }

        .mica {
            backdrop-filter: blur(40px) brightness(120%);
            -webkit-backdrop-filter: blur(40px) brightness(120%);
            background: var(--mica);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .window-shadow {
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        input[type="range"] {
            -webkit-appearance: none;
            background: rgba(255,255,255,0.1);
            height: 4px;
            border-radius: 2px;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--accent);
            border-radius: 50%;
            cursor: pointer;
        }

        .haptic-btn:active {
            transform: scale(0.96);
        }

        @keyframes scan-line {
            0% { top: 0%; }
            100% { top: 100%; }
        }
        .scan-line {
            height: 2px;
            background: #00ffcc;
            box-shadow: 0 0 15px #00ffcc;
            position: absolute;
            width: 100%;
            animation: scan-line 2s linear infinite;
        }
    </style>
</head>
<body oncontextmenu="return false;">
    <div id="orientation-warning" class="fixed inset-0 bg-black z-[10000] hidden flex-col items-center justify-center text-center p-10">
        <i data-lucide="rotate-cw" class="w-16 h-16 mb-4 animate-spin text-blue-500"></i>
        <h1 class="text-xl font-bold">Please Rotate Your Device</h1>
        <p class="text-white/60 mt-2">WinNext OS is optimized for Landscape experience.</p>
    </div>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;
        const { motion, AnimatePresence, useDragControls } = FramerMotion;

        const APPS = [
            { id: 'explorer', name: 'File Explorer', icon: 'folder', color: 'text-yellow-400' },
            { id: 'edge', name: 'Edge Quantum', icon: 'globe', color: 'text-blue-400' },
            { id: 'copilot', name: 'AI Assistant', icon: 'sparkles', color: 'text-purple-400' },
            { id: 'settings', name: 'Settings', icon: 'settings', color: 'text-slate-300' },
            { id: 'terminal', name: 'Terminal', icon: 'terminal', color: 'text-emerald-400' },
            { id: 'cloud', name: 'Cloud Drive', icon: 'cloud', color: 'text-blue-300' }
        ];

        const Icon = ({ name, size = 24, className = "" }) => {
            useEffect(() => { window.lucide && window.lucide.createIcons(); }, [name]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        const haptic = () => { if(navigator.vibrate) navigator.vibrate(12); };

        const App = () => {
            const [bootState, setBootState] = useState('logo'); // logo, biometric, desktop
            const [openWindows, setOpenWindows] = useState([]);
            const [activeWindow, setActiveWindow] = useState(null);
            const [isStartOpen, setIsStartOpen] = useState(false);
            const [isSearchOpen, setIsSearchOpen] = useState(false);
            const [isCopilotOpen, setIsCopilotOpen] = useState(false);
            const [isControlOpen, setIsControlOpen] = useState(false);
            const [notifications, setNotifications] = useState([]);
            const [zCounter, setZCounter] = useState(100);
            const [time, setTime] = useState(new Date());

            // Cloud Simulation Logic
            const [cloudFiles, setCloudFiles] = useState(() => {
                const saved = localStorage.getItem('win_cloud_files');
                return saved ? JSON.parse(saved) : [
                    { name: 'Project_Alpha.docx', size: '1.2MB' },
                    { name: 'Resume_NextGen.pdf', size: '800KB' }
                ];
            });

            useEffect(() => {
                const timer = setTimeout(() => setBootState('biometric'), 2500);
                const clock = setInterval(() => setTime(new Date()), 1000);
                
                const handleKeyDown = (e) => {
                    if (e.ctrlKey && e.key === 's') {
                        e.preventDefault();
                        setIsSearchOpen(true);
                    }
                };
                window.addEventListener('keydown', handleKeyDown);

                // Register Service Worker
                if ('serviceWorker' in navigator) {
                    const swCode = `self.addEventListener('fetch', function(event) {});`;
                    const blob = new Blob([swCode], {type: 'application/javascript'});
                    navigator.serviceWorker.register(URL.createObjectURL(blob));
                }

                return () => { clearTimeout(timer); clearInterval(clock); window.removeEventListener('keydown', handleKeyDown); };
            }, []);

            const addNotification = (title, msg) => {
                const id = Date.now();
                setNotifications(prev => [...prev, { id, title, msg }]);
                setTimeout(() => setNotifications(prev => prev.filter(n => n.id !== id)), 5000);
            };

            const focusWindow = (id) => {
                setActiveWindow(id);
                setZCounter(prev => prev + 1);
                setOpenWindows(prev => prev.map(w => w.id === id ? { ...w, z: zCounter + 1, minimized: false } : w));
            };

            const openApp = (appId) => {
                haptic();
                setIsStartOpen(false);
                setIsSearchOpen(false);
                if (openWindows.find(w => w.id === appId)) {
                    focusWindow(appId);
                    return;
                }
                const app = APPS.find(a => a.id === appId);
                setOpenWindows([...openWindows, { ...app, z: zCounter + 1, minimized: false }]);
                setActiveWindow(appId);
                setZCounter(prev => prev + 1);
            };

            const closeApp = (appId) => {
                haptic();
                setOpenWindows(prev => prev.filter(w => w.id !== appId));
            };

            const toggleMinimize = (appId) => {
                haptic();
                setOpenWindows(prev => prev.map(w => w.id === appId ? { ...w, minimized: !w.minimized } : w));
            };

            if (bootState === 'logo') {
                return (
                    <div className="h-screen w-screen bg-black flex items-center justify-center">
                        <motion.div 
                            initial={{ scale: 0.8, opacity: 0 }} 
                            animate={{ scale: 1, opacity: 1 }} 
                            className="flex flex-col items-center"
                        >
                            <Icon name="command" size={80} className="text-blue-500 mb-8" />
                            <div className="w-48 h-1 bg-white/10 rounded-full overflow-hidden">
                                <motion.div 
                                    className="h-full bg-blue-500"
                                    initial={{ width: 0 }}
                                    animate={{ width: '100%' }}
                                    transition={{ duration: 2 }}
                                />
                            </div>
                        </motion.div>
                    </div>
                );
            }

            if (bootState === 'biometric') {
                return (
                    <div className="h-screen w-screen bg-[url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2000')] bg-cover bg-center flex items-center justify-center relative">
                        <div className="absolute inset-0 bg-black/40 backdrop-blur-md"></div>
                        <motion.div 
                            initial={{ y: 20, opacity: 0 }}
                            animate={{ y: 0, opacity: 1 }}
                            className="z-10 text-center"
                        >
                            <div className="mb-6 relative w-32 h-32 mx-auto border-2 border-white/20 rounded-2xl overflow-hidden p-4">
                                <Icon name="fingerprint" size={64} className="text-white mx-auto mt-4" />
                                <div className="scan-line"></div>
                            </div>
                            <h1 className="text-2xl font-semibold mb-2">Identify Yourself</h1>
                            <p className="text-white/60 mb-8">Place your finger to unlock WinNext</p>
                            <button 
                                onClick={() => { haptic(); setBootState('desktop'); addNotification('System', 'Welcome back, Administrator'); }}
                                className="px-8 py-3 bg-white/10 border border-white/20 rounded-full hover:bg-white/20 transition-all haptic-btn"
                            >
                                Simulate Scan
                            </button>
                        </motion.div>
                    </div>
                );
            }

            return (
                <div className="h-screen w-screen overflow-hidden relative bg-[url('https://images.unsplash.com/photo-1635776062127-d379bfcba9f8?q=80&w=2000')] bg-cover bg-center">
                    
                    {/* Desktop Area */}
                    <div className="absolute inset-0 p-4 grid grid-flow-col grid-rows-[repeat(auto-fill,100px)] gap-4 content-start justify-start z-10 pt-16">
                        {APPS.map(app => (
                            <div 
                                key={app.id}
                                onClick={() => openApp(app.id)}
                                className="flex flex-col items-center justify-center w-24 h-24 rounded-xl hover:bg-white/10 transition-colors group cursor-pointer"
                            >
                                <div className={`${app.color} mb-2 group-hover:scale-110 transition-transform`}>
                                    <Icon name={app.icon} size={40} />
                                </div>
                                <span className="text-[10px] text-white font-medium text-center drop-shadow-md truncate w-full px-2">{app.name}</span>
                            </div>
                        ))}
                    </div>

                    {/* Window Layer */}
                    <AnimatePresence>
                        {openWindows.map(win => !win.minimized && (
                            <Window 
                                key={win.id} 
                                win={win} 
                                isActive={activeWindow === win.id}
                                onClose={() => closeApp(win.id)}
                                onMinimize={() => toggleMinimize(win.id)}
                                onFocus={() => focusWindow(win.id)}
                                cloudFiles={cloudFiles}
                                setCloudFiles={setCloudFiles}
                            />
                        ))}
                    </AnimatePresence>

                    {/* UI Overlays */}
                    <AnimatePresence>
                        {isStartOpen && <StartMenu onAppClick={openApp} onClose={() => setIsStartOpen(false)} />}
                        {isSearchOpen && <UniversalSearch onAppClick={openApp} onClose={() => setIsSearchOpen(false)} />}
                        {isCopilotOpen && <CopilotSidebar onClose={() => setIsCopilotOpen(false)} />}
                        {isControlOpen && <ControlCenter onClose={() => setIsControlOpen(false)} />}
                    </AnimatePresence>

                    {/* Toast Notifications */}
                    <div className="fixed top-6 right-6 z-[2000] flex flex-col gap-3">
                        <AnimatePresence>
                            {notifications.map(n => (
                                <motion.div 
                                    key={n.id}
                                    initial={{ x: 100, opacity: 0 }}
                                    animate={{ x: 0, opacity: 1 }}
                                    exit={{ x: 100, opacity: 0 }}
                                    className="acrylic p-4 rounded-2xl border border-white/10 w-64 shadow-2xl"
                                >
                                    <h4 className="text-xs font-bold text-blue-400 mb-1">{n.title}</h4>
                                    <p className="text-xs text-white/80">{n.msg}</p>
                                </motion.div>
                            ))}
                        </AnimatePresence>
                    </div>

                    {/* Dynamic Taskbar */}
                    <div className="fixed bottom-4 left-1/2 -translate-x-1/2 flex items-center gap-1 p-2 mica rounded-[24px] z-[1500] border border-white/10 shadow-2xl h-16">
                        <button onClick={() => { haptic(); setIsStartOpen(!isStartOpen); }} className="w-12 h-12 flex items-center justify-center rounded-xl hover:bg-white/10 text-blue-400 haptic-btn">
                            <Icon name="layout-grid" size={26} />
                        </button>
                        <button onClick={() => { haptic(); setIsSearchOpen(!isSearchOpen); }} className="w-12 h-12 flex items-center justify-center rounded-xl hover:bg-white/10 text-white/70 haptic-btn">
                            <Icon name="search" size={22} />
                        </button>
                        
                        <div className="w-px h-8 bg-white/10 mx-2" />
                        
                        {openWindows.map(win => (
                            <button 
                                key={win.id}
                                onClick={() => focusWindow(win.id)}
                                className={`w-12 h-12 flex items-center justify-center rounded-xl transition-all relative group ${activeWindow === win.id ? 'bg-white/10' : ''}`}
                            >
                                <Icon name={win.icon} size={24} className={win.color} />
                                <div className={`absolute bottom-1 h-1 rounded-full bg-blue-400 transition-all ${activeWindow === win.id ? 'w-4' : 'w-1 group-hover:w-2'}`} />
                            </button>
                        ))}

                        <div className="w-px h-8 bg-white/10 mx-2" />
                        
                        <button onClick={() => { haptic(); setIsCopilotOpen(!isCopilotOpen); }} className="w-12 h-12 flex items-center justify-center rounded-xl hover:bg-white/10 text-purple-400 haptic-btn">
                            <Icon name="sparkles" size={22} />
                        </button>

                        <div className="flex items-center gap-3 ml-4 px-4 h-full rounded-xl hover:bg-white/5 cursor-pointer" onClick={() => setIsControlOpen(!isControlOpen)}>
                            <div className="flex flex-col items-end text-right">
                                <span className="text-xs font-bold">{time.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
                                <span className="text-[9px] opacity-60">{time.toLocaleDateString([], { month: 'short', day: 'numeric' })}</span>
                            </div>
                            <div className="flex items-center gap-1.5 opacity-70">
                                <Icon name="wifi" size={14} />
                                <Icon name="battery" size={14} />
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const Window = ({ win, isActive, onClose, onMinimize, onFocus, cloudFiles, setCloudFiles }) => {
            const dragControls = useDragControls();

            return (
                <motion.div 
                    layout
                    initial={{ scale: 0.9, opacity: 0, y: 30 }}
                    animate={{ scale: 1, opacity: 1, y: 0 }}
                    exit={{ scale: 0.9, opacity: 0, y: 30 }}
                    drag
                    dragMomentum={false}
                    dragControls={dragControls}
                    dragListener={false}
                    onPointerDown={onFocus}
                    style={{ zIndex: win.z }}
                    className={`fixed left-20 top-10 w-[70%] h-[70%] mica rounded-[20px] overflow-hidden window-shadow border border-white/20 flex flex-col ${isActive ? 'ring-2 ring-blue-500/50' : 'opacity-95'}`}
                >
                    {/* Toolbar */}
                    <div 
                        onPointerDown={(e) => dragControls.start(e)}
                        className="h-10 flex items-center justify-between px-4 bg-white/5 cursor-move"
                    >
                        <div className="flex items-center gap-3">
                            <Icon name={win.icon} size={14} className={win.color} />
                            <span className="text-[11px] font-semibold tracking-wide uppercase opacity-70">{win.name}</span>
                        </div>
                        <div className="flex items-center gap-1">
                            <button onClick={onMinimize} className="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-white/10 transition-colors">
                                <Icon name="minus" size={14} />
                            </button>
                            <button onClick={onClose} className="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-red-500 transition-colors">
                                <Icon name="x" size={14} />
                            </button>
                        </div>
                    </div>

                    <div className="flex-1 overflow-auto bg-black/10">
                        {win.id === 'explorer' && <FileExplorer isCloud={false} />}
                        {win.id === 'cloud' && <FileExplorer isCloud={true} files={cloudFiles} setFiles={setCloudFiles} />}
                        {win.id === 'settings' && <SettingsPanel />}
                        {win.id === 'terminal' && <TerminalPanel />}
                        {win.id === 'edge' && <BrowserPanel />}
                        {win.id === 'copilot' && <CopilotPanel />}
                    </div>
                </motion.div>
            );
        };

        const FileExplorer = ({ isCloud, files = [], setFiles }) => (
            <div className="p-6">
                <div className="flex items-center gap-2 mb-6 text-sm opacity-60">
                    <Icon name="chevron-right" size={14} />
                    <span>This PC</span>
                    <Icon name="chevron-right" size={14} />
                    <span>{isCloud ? 'Cloud Sync' : 'Internal Storage'}</span>
                </div>
                <div className="grid grid-cols-4 gap-6">
                    {(isCloud ? files : [
                        { name: 'Documents', type: 'folder' },
                        { name: 'Photos', type: 'folder' },
                        { name: 'System.sys', type: 'file' }
                    ]).map((f, i) => (
                        <div key={i} className="flex flex-col items-center gap-2 p-4 rounded-xl hover:bg-white/5 cursor-pointer group">
                            <Icon 
                                name={f.type === 'folder' || !f.type ? 'folder' : 'file-text'} 
                                size={40} 
                                className={f.type === 'folder' || !f.type ? 'text-yellow-500' : 'text-blue-400'} 
                            />
                            <span className="text-xs group-hover:text-blue-400 transition-colors">{f.name}</span>
                        </div>
                    ))}
                    {isCloud && (
                        <button 
                            onClick={() => {
                                const name = prompt("File name:");
                                if(name) setFiles([...files, { name, size: '0KB' }]);
                            }}
                            className="flex flex-col items-center justify-center gap-2 p-4 rounded-xl border border-dashed border-white/20 hover:bg-white/5"
                        >
                            <Icon name="plus" size={24} />
                            <span className="text-[10px] uppercase font-bold">New File</span>
                        </button>
                    )}
                </div>
            </div>
        );

        const StartMenu = ({ onAppClick, onClose }) => (
            <motion.div 
                initial={{ y: 100, opacity: 0 }}
                animate={{ y: 0, opacity: 1 }}
                exit={{ y: 100, opacity: 0 }}
                className="fixed bottom-24 left-1/2 -translate-x-1/2 w-[500px] mica rounded-[32px] p-8 z-[1600] border border-white/10 shadow-2xl"
            >
                <div className="flex items-center justify-between mb-8">
                    <h3 className="text-lg font-bold">Pinned Apps</h3>
                    <button className="text-xs text-blue-400">All Apps &gt;</button>
                </div>
                <div className="grid grid-cols-4 gap-y-10">
                    {APPS.map(app => (
                        <button key={app.id} onClick={() => onAppClick(app.id)} className="flex flex-col items-center gap-3 group haptic-btn">
                            <div className={`${app.color} p-4 bg-white/5 rounded-2xl group-hover:bg-white/10 transition-all`}>
                                <Icon name={app.icon} size={32} />
                            </div>
                            <span className="text-[11px] font-medium opacity-80">{app.name}</span>
                        </button>
                    ))}
                </div>
                <div className="mt-12 pt-6 border-t border-white/5 flex items-center justify-between">
                    <div className="flex items-center gap-4">
                        <div className="w-10 h-10 rounded-full bg-gradient-to-tr from-blue-500 to-indigo-600 flex items-center justify-center font-bold">A</div>
                        <span className="text-sm">Administrator</span>
                    </div>
                    <button onClick={() => window.location.reload()} className="p-2 hover:bg-red-500/20 rounded-full text-red-400"><Icon name="power" size={20} /></button>
                </div>
            </motion.div>
        );

        const UniversalSearch = ({ onAppClick, onClose }) => {
            const [query, setQuery] = useState('');
            const filtered = APPS.filter(a => a.name.toLowerCase().includes(query.toLowerCase()));
            
            return (
                <div className="fixed inset-0 z-[1700] flex items-center justify-center p-4">
                    <div className="absolute inset-0 bg-black/40" onClick={onClose} />
                    <motion.div 
                        initial={{ scale: 0.95, opacity: 0 }}
                        animate={{ scale: 1, opacity: 1 }}
                        className="w-[600px] mica rounded-3xl overflow-hidden border border-white/20 shadow-2xl relative"
                    >
                        <div className="p-6 flex items-center gap-4 border-b border-white/10">
                            <Icon name="search" size={24} className="text-blue-400" />
                            <input 
                                autoFocus
                                className="bg-transparent border-none outline-none text-xl w-full"
                                placeholder="Search everything..."
                                value={query}
                                onChange={e => setQuery(e.target.value)}
                            />
                        </div>
                        <div className="max-h-[400px] overflow-auto p-4 no-scrollbar">
                            {filtered.map(app => (
                                <div 
                                    key={app.id} 
                                    onClick={() => onAppClick(app.id)}
                                    className="flex items-center gap-4 p-4 rounded-2xl hover:bg-white/10 cursor-pointer mb-1"
                                >
                                    <Icon name={app.icon} className={app.color} />
                                    <span className="flex-1">{app.name}</span>
                                    <span className="text-[10px] opacity-40">SYSTEM APP</span>
                                </div>
                            ))}
                            {query && <div className="p-4 flex items-center gap-4 text-blue-400"><Icon name="globe" size={18} /> Search web for "{query}"</div>}
                        </div>
                    </motion.div>
                </div>
            );
        };

        const ControlCenter = ({ onClose }) => (
            <motion.div 
                initial={{ y: -20, opacity: 0, x: 20 }}
                animate={{ y: 0, opacity: 1, x: 0 }}
                exit={{ y: -20, opacity: 0, x: 20 }}
                className="fixed top-16 right-4 w-80 mica rounded-3xl p-6 z-[1600] border border-white/10 shadow-2xl"
            >
                <div className="grid grid-cols-3 gap-4 mb-8">
                    {['wifi', 'bluetooth', 'moon', 'plane', 'zap', 'cast'].map(ic => (
                        <div key={ic} className="flex flex-col items-center gap-2">
                            <button className="w-12 h-12 bg-white/10 hover:bg-blue-500 rounded-2xl flex items-center justify-center transition-all haptic-btn">
                                <Icon name={ic} size={20} />
                            </button>
                            <span className="text-[10px] uppercase tracking-tighter opacity-60 font-bold">{ic}</span>
                        </div>
                    ))}
                </div>
                <div className="space-y-6">
                    <div className="flex items-center gap-4">
                        <Icon name="sun" size={18} className="text-yellow-400" />
                        <input type="range" className="flex-1" defaultValue="80" />
                    </div>
                    <div className="flex items-center gap-4">
                        <Icon name="volume-2" size={18} className="text-blue-400" />
                        <input type="range" className="flex-1" defaultValue="45" />
                    </div>
                </div>
                <div className="mt-8 pt-6 border-t border-white/5 flex justify-between items-center text-xs">
                    <span className="opacity-60">Battery: 84%</span>
                    <span className="text-blue-400">Settings</span>
                </div>
            </motion.div>
        );

        const CopilotSidebar = ({ onClose }) => (
            <motion.div 
                initial={{ x: '100%' }}
                animate={{ x: 0 }}
                exit={{ x: '100%' }}
                className="fixed top-0 right-0 h-full w-96 mica border-l border-white/10 z-[1800] p-6 flex flex-col"
            >
                <div className="flex items-center justify-between mb-8">
                    <div className="flex items-center gap-3 text-purple-400">
                        <Icon name="sparkles" size={24} />
                        <h2 className="font-bold text-lg">Copilot Quantum</h2>
                    </div>
                    <button onClick={onClose}><Icon name="x" size={20} /></button>
                </div>
                <div className="flex-1 overflow-auto space-y-4 no-scrollbar">
                    <div className="bg-white/5 p-4 rounded-2xl border border-white/10">
                        <p className="text-sm text-white/80 leading-relaxed">Hello! I'm your system-integrated AI. I can help you organize files, change settings, or simulate futuristic tasks.</p>
                    </div>
                    <div className="bg-blue-500/10 p-4 rounded-2xl border border-blue-500/20 text-blue-300 text-xs">
                        Tip: You can ask me to "Open Terminal" or "Set Dark Mode".
                    </div>
                </div>
                <div className="mt-4 p-2 bg-white/5 rounded-2xl flex items-center">
                    <input className="bg-transparent border-none outline-none p-2 flex-1 text-sm" placeholder="Ask me anything..." />
                    <button className="p-2 text-purple-400"><Icon name="send" size={18} /></button>
                </div>
            </motion.div>
        );

        const TerminalPanel = () => {
            const [lines, setLines] = useState(['WinNext Kernel v14.0.2-quantum', 'Copyright (c) 2024 Future OS Corp.', 'Type "help" for commands.']);
            const [val, setVal] = useState('');
            const exec = (e) => {
                if(e.key === 'Enter') {
                    const cmd = val.toLowerCase();
                    let res = `Command '${cmd}' not recognized.`;
                    if(cmd === 'help') res = 'Available: clear, date, system, neofetch, whoami';
                    if(cmd === 'clear') { setLines([]); setVal(''); return; }
                    if(cmd === 'date') res = new Date().toLocaleString();
                    if(cmd === 'neofetch') res = 'OS: WinNext 14\nKernel: 14.0.2-q\nShell: BashSim\nUptime: 2h 15m';
                    setLines([...lines, `> ${val}`, res]);
                    setVal('');
                }
            };
            return (
                <div className="h-full bg-black/90 p-4 font-mono text-xs text-emerald-400 flex flex-col">
                    <div className="flex-1 overflow-auto no-scrollbar">
                        {lines.map((l, i) => <div key={i} className="mb-1 whitespace-pre-wrap">{l}</div>)}
                    </div>
                    <div className="flex gap-2 mt-2">
                        <span>$</span>
                        <input className="bg-transparent border-none outline-none flex-1" value={val} onChange={e => setVal(e.target.value)} onKeyDown={exec} autoFocus />
                    </div>
                </div>
            );
        };

        const BrowserPanel = () => (
            <div className="h-full flex flex-col bg-white">
                <div className="h-10 bg-gray-100 flex items-center px-4 gap-4 border-b">
                    <div className="flex gap-2">
                        <div className="w-2 h-2 rounded-full bg-red-400"></div>
                        <div className="w-2 h-2 rounded-full bg-yellow-400"></div>
                        <div className="w-2 h-2 rounded-full bg-green-400"></div>
                    </div>
                    <div className="flex-1 bg-white h-7 rounded-md border text-[10px] flex items-center px-3 text-gray-500 gap-2">
                        <Icon name="lock" size={10} className="text-green-500" />
                        <span>https://quantum.search</span>
                    </div>
                </div>
                <div className="flex-1 flex flex-col items-center justify-center text-black p-10 text-center">
                    <div className="w-20 h-20 bg-blue-600 rounded-3xl flex items-center justify-center text-white mb-6 shadow-xl">
                        <Icon name="globe" size={40} />
                    </div>
                    <h2 className="text-2xl font-bold mb-2">Edge Quantum</h2>
                    <p className="text-gray-400 max-w-xs">Web engine initialized. Simulation mode active for mobile performance stability.</p>
                </div>
            </div>
        );

        const SettingsPanel = () => (
            <div className="p-8 text-white max-w-2xl mx-auto">
                <h2 className="text-3xl font-bold mb-8">Settings</h2>
                <div className="grid gap-4">
                    {[
                        { n: 'System', i: 'monitor', c: 'text-blue-400' },
                        { n: 'Personalization', i: 'palette', c: 'text-purple-400' },
                        { n: 'Security', i: 'shield-check', c: 'text-emerald-400' },
                        { n: 'Updates', i: 'refresh-cw', c: 'text-yellow-400' }
                    ].map(s => (
                        <div key={s.n} className="flex items-center gap-4 p-4 bg-white/5 rounded-2xl border border-white/5 hover:bg-white/10 cursor-pointer">
                            <Icon name={s.i} className={s.c} />
                            <span className="font-semibold">{s.n}</span>
                            <div className="flex-1" />
                            <Icon name="chevron-right" size={16} className="opacity-40" />
                        </div>
                    ))}
                </div>
            </div>
        );

        const CopilotPanel = () => (
            <div className="h-full flex flex-col p-8 items-center justify-center text-center">
                <Icon name="sparkles" size={64} className="text-purple-400 mb-6 animate-pulse" />
                <h3 className="text-xl font-bold mb-4">AI Copilot Experience</h3>
                <p className="opacity-60 max-w-sm mb-8">Integrated assistant using local neural mesh simulation. Ready to optimize your workflow.</p>
                <div className="w-full flex gap-2">
                    <input className="flex-1 bg-white/10 p-3 rounded-xl border border-white/10" placeholder="Type a request..." />
                    <button className="bg-purple-600 px-6 rounded-xl font-bold">Ask</button>
                </div>
            </div>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
