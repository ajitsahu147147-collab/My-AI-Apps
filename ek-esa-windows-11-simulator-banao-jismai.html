<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Windows 10 Web Desktop</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Theme color for browser chrome -->
    <meta name="theme-color" content="#0078d4" />

    <!-- iOS / Safari PWA support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WinDesk" />
    <link rel="apple-touch-icon" href="/icon-512.svg" />

    <!-- Microsoft / Edge PWA tiles -->
    <meta name="msapplication-TileColor" content="#0078d4" />
    <meta name="msapplication-TileImage" content="/icon-192.svg" />

    <!-- SEO / Open Graph -->
    <meta name="description" content="A Windows 10 inspired web desktop. Works offline as a PWA." />
    <meta property="og:title" content="Windows 10 Web Desktop" />
    <meta property="og:description" content="Full-screen Windows 10 desktop experience in your browser." />
    <meta property="og:image" content="/opengraph.jpg" />
    <meta property="og:type" content="website" />

    <!-- App icon -->
    <link rel="icon" type="image/svg+xml" href="/icon-192.svg" />

    <!-- Preconnect for Unsplash wallpapers -->
    <link rel="preconnect" href="https://images.unsplash.com" />

    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Splash screen and App styles -->
    <style>
      * { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        background: #0a0a14;
        overflow: hidden;
        height: 100%;
        width: 100%;
        overscroll-behavior: none;
        touch-action: manipulation;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        /* iOS safe-area insets */
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      }
      #root {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
      }
      /* Loading splash */
      #splash {
        position: fixed;
        inset: 0;
        background: #0a0a14;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 20px;
        z-index: 9999;
        transition: opacity 0.4s ease;
      }
      #splash.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #splash-logo {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
        width: 64px;
        height: 64px;
        animation: splashPulse 1.2s ease-in-out infinite;
      }
      #splash-logo div:nth-child(1) { background: #f35325; border-radius: 2px; }
      #splash-logo div:nth-child(2) { background: #81bc06; border-radius: 2px; }
      #splash-logo div:nth-child(3) { background: #05a6f0; border-radius: 2px; }
      #splash-logo div:nth-child(4) { background: #ffba08; border-radius: 2px; }
      #splash p {
        color: rgba(255,255,255,0.6);
        font-size: 14px;
        margin: 0;
        letter-spacing: 0.04em;
      }
      @keyframes splashPulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(0.95); }
      }

      /* Desktop Styles */
      .desktop-bg {
        background: url('https://images.unsplash.com/photo-1510519133417-c864bb01f5ad?q=80&w=2070&auto=format&fit=crop') no-repeat center center;
        background-size: cover;
      }

      .glass-win10 {
        background: rgba(20, 20, 20, 0.85);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .window {
        position: absolute;
        transition: transform 0.2s cubic-bezier(0.17, 0.67, 0.83, 0.67), opacity 0.2s;
        display: flex;
        flex-direction: column;
        border-radius: 0px; /* Win10 has sharp corners */
        overflow: hidden;
        box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        border: 1px solid #333;
      }

      .window-minimized {
        transform: scale(0.9) translateY(20px);
        opacity: 0;
        pointer-events: none;
      }

      .taskbar-icon {
        transition: background 0.2s;
        border-bottom: 2px solid transparent;
      }
      .taskbar-icon.active {
        background: rgba(255,255,255,0.1);
        border-bottom: 2px solid #0078d4;
      }

      .start-menu {
        bottom: 48px;
        left: 0;
        transform: translateY(120%);
        transition: transform 0.25s ease-out;
        z-index: 1000;
        width: 100%;
        max-width: 400px;
        height: 500px;
        max-height: 80vh;
      }

      .start-menu.active {
        transform: translateY(0);
      }

      /* Excel Grid */
      .excel-grid {
        display: grid;
        grid-template-columns: 40px repeat(10, 100px);
        grid-template-rows: repeat(20, 30px);
      }
      .excel-cell {
        border: 0.5px solid #d1d5db;
        padding: 2px 4px;
        font-size: 13px;
        outline: none;
      }
      .excel-cell:focus {
        border: 2px solid #217346;
        z-index: 10;
      }

      .line-numbers {
        color: #858585;
        text-align: right;
        padding-right: 10px;
        user-select: none;
      }
    </style>
  </head>
  <body class="desktop-bg">
    <!-- Loading splash screen -->
    <div id="splash">
      <div id="splash-logo">
        <div></div><div></div><div></div><div></div>
      </div>
      <p>Windows 10 Web Desktop</p>
    </div>

    <div id="root" class="relative overflow-hidden">
        <!-- Desktop Area -->
        <div id="desktop" class="w-full h-full p-4 flex flex-col flex-wrap content-start gap-4">
            <!-- Dynamic Icons could go here -->
        </div>

        <!-- Windows Container -->
        <div id="window-layer" class="absolute inset-0 pointer-events-none"></div>

        <!-- Start Menu -->
        <div id="start-menu" class="start-menu fixed glass-win10 p-0 shadow-2xl flex">
            <!-- Left Sidebar -->
            <div class="w-12 flex flex-col items-center py-4 gap-6 text-white/70">
                <div class="mt-auto flex flex-col gap-6">
                    <button class="hover:text-white">👤</button>
                    <button class="hover:text-white">⚙️</button>
                    <button class="hover:text-white">⏻</button>
                </div>
            </div>
            <!-- Main List -->
            <div class="flex-1 bg-black/20 p-4 overflow-y-auto">
                <h3 class="text-[10px] font-semibold text-white/50 mb-4 uppercase tracking-widest">Life at a glance</h3>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="openApp('word')" class="bg-[#2b579a] p-4 text-white text-left text-sm flex flex-col justify-between h-24">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/f/fd/Microsoft_Office_Word_%282019%E2%80%93present%29.svg/512px-Microsoft_Office_Word_%282019%E2%80%93present%29.svg.png" class="w-6 h-6">
                        <span>Word</span>
                    </button>
                    <button onclick="openApp('excel')" class="bg-[#217346] p-4 text-white text-left text-sm flex flex-col justify-between h-24">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/7/73/Microsoft_Office_Excel_%282019%E2%80%93present%29.svg/512px-Microsoft_Office_Excel_%282019%E2%80%93present%29.svg.png" class="w-6 h-6">
                        <span>Excel</span>
                    </button>
                    <button onclick="openApp('vscode')" class="bg-[#007acc] p-4 text-white text-left text-sm flex flex-col justify-between h-24">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/9/9a/Visual_Studio_Code_1.35_icon.svg/512px-Visual_Studio_Code_1.35_icon.svg.png" class="w-6 h-6">
                        <span>Code</span>
                    </button>
                    <button onclick="openApp('notes')" class="bg-[#ffc107] p-4 text-black text-left text-sm flex flex-col justify-between h-24">
                        <img src="https://cdn-icons-png.flaticon.com/512/1024/1024824.png" class="w-6 h-6">
                        <span>Notes</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Taskbar -->
        <div class="fixed bottom-0 left-0 w-full h-12 glass-win10 flex items-center px-0 z-[2000]">
            <button onclick="toggleStartMenu()" class="taskbar-icon h-full px-4 hover:bg-white/10">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="#fff"><path d="M0 0h11.2v11.2H0V0zm12.8 0H24v11.2H12.8V0zM0 12.8h11.2V24H0V12.8zm12.8 0H24V24H12.8V12.8z"/></svg>
            </button>
            <div class="flex-1 flex items-center h-full">
                <button onclick="openApp('word')" class="taskbar-icon h-full px-3 flex items-center hover:bg-white/10">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/f/fd/Microsoft_Office_Word_%282019%E2%80%93present%29.svg/512px-Microsoft_Office_Word_%282019%E2%80%93present%29.svg.png" class="w-6 h-6">
                </button>
                <button onclick="openApp('excel')" class="taskbar-icon h-full px-3 flex items-center hover:bg-white/10">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/7/73/Microsoft_Office_Excel_%282019%E2%80%93present%29.svg/512px-Microsoft_Office_Excel_%282019%E2%80%93present%29.svg.png" class="w-6 h-6">
                </button>
                <button onclick="openApp('vscode')" class="taskbar-icon h-full px-3 flex items-center hover:bg-white/10">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/9/9a/Visual_Studio_Code_1.35_icon.svg/512px-Visual_Studio_Code_1.35_icon.svg.png" class="w-6 h-6">
                </button>
            </div>
            <div class="flex items-center h-full px-3 text-white text-[10px] border-l border-white/10">
                <div class="flex flex-col items-end">
                    <span id="taskbar-time">12:00 PM</span>
                    <span id="taskbar-date">10/24/2023</span>
                </div>
            </div>
        </div>
    </div>

    <!-- App Note Footer -->
    <div class="fixed bottom-14 left-0 w-full text-center pointer-events-none z-[3000]">
        <span class="bg-black/40 text-white/80 text-[10px] px-3 py-1 rounded-sm">Built: Windows 10 Web Desktop with PWA and Office apps. Next: Taskbar window previews on hover.</span>
    </div>

    <script>
      // Service Worker registration
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js?v=2', { scope: '/' })
            .then((reg) => console.log('[PWA] Registered'))
            .catch((err) => console.warn('[PWA] Failed', err));
        });
      }

      // App Logic
      const windowLayer = document.getElementById('window-layer');
      const startMenu = document.getElementById('start-menu');
      let zIndexCounter = 100;

      function toggleStartMenu() {
          startMenu.classList.toggle('active');
      }

      function closeStartMenu() {
          startMenu.classList.remove('active');
      }

      function updateDateTime() {
          const now = new Date();
          const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          const dateStr = now.toLocaleDateString();
          document.getElementById('taskbar-time').innerText = timeStr;
          document.getElementById('taskbar-date').innerText = dateStr;
      }
      setInterval(updateDateTime, 1000);
      updateDateTime();

      const APP_CONFIG = {
          word: { title: 'Word', icon: 'https://upload.wikimedia.org/wikipedia/commons/thumb/f/fd/Microsoft_Office_Word_%282019%E2%80%93present%29.svg/512px-Microsoft_Office_Word_%282019%E2%80%93present%29.svg.png' },
          excel: { title: 'Excel', icon: 'https://upload.wikimedia.org/wikipedia/commons/thumb/7/73/Microsoft_Office_Excel_%282019%E2%80%93present%29.svg/512px-Microsoft_Office_Excel_%282019%E2%80%93present%29.svg.png' },
          vscode: { title: 'Visual Studio Code', icon: 'https://upload.wikimedia.org/wikipedia/commons/thumb/9/9a/Visual_Studio_Code_1.35_icon.svg/512px-Visual_Studio_Code_1.35_icon.svg.png' },
          notes: { title: 'Sticky Notes', icon: 'https://cdn-icons-png.flaticon.com/512/1024/1024824.png' }
      };

      function openApp(appId) {
          closeStartMenu();
          const existing = document.getElementById(`window-${appId}`);
          if (existing) {
              existing.classList.remove('window-minimized');
              focusWindow(appId);
              return;
          }

          const config = APP_CONFIG[appId];
          const win = document.createElement('div');
          win.id = `window-${appId}`;
          win.className = 'window bg-white w-full h-[85vh] sm:w-[80%] sm:h-[70%] top-[5%] sm:left-[10%] pointer-events-auto';
          win.style.zIndex = ++zIndexCounter;

          win.innerHTML = `
              <div class="h-8 bg-[#f3f3f3] flex items-center justify-between px-3 border-b border-gray-300 handle">
                  <div class="flex items-center gap-2">
                      <img src="${config.icon}" class="w-4 h-4">
                      <span class="text-[11px] text-gray-700">${config.title}</span>
                  </div>
                  <div class="flex h-full">
                      <button onclick="minimizeWindow('${appId}')" class="px-3 hover:bg-gray-200 text-gray-800 text-lg">_</button>
                      <button onclick="closeWindow('${appId}')" class="px-3 hover:bg-red-600 hover:text-white text-gray-800 text-sm">✕</button>
                  </div>
              </div>
              <div class="flex-1 overflow-auto relative bg-white">
                  ${getAppContent(appId)}
              </div>
          `;

          windowLayer.appendChild(win);
          focusWindow(appId);
      }

      function getAppContent(appId) {
          switch(appId) {
              case 'word':
                  return `<div class="p-8 max-w-2xl mx-auto shadow-sm my-4 border min-h-[500px] outline-none" contenteditable="true"><h1 class="text-2xl font-serif">Document 1</h1><p class="mt-4">Start typing your document...</p></div>`;
              case 'excel':
                  let rows = '';
                  for(let i=0; i<30; i++) {
                      rows += `<div class="excel-cell bg-gray-50 flex items-center justify-center font-bold text-gray-400 text-[10px]">${i+1}</div>`;
                      for(let j=0; j<10; j++) rows += `<input class="excel-cell" type="text">`;
                  }
                  return `<div class="excel-grid">${'<div class="excel-cell bg-gray-50"></div>' + 'ABCDEFGHIJ'.split('').map(l => `<div class="excel-cell bg-gray-50 flex items-center justify-center font-bold text-gray-400 text-[10px]">${l}</div>`).join('')}${rows}</div>`;
              case 'vscode':
                  return `<div class="bg-[#1e1e1e] text-[#d4d4d4] h-full flex font-mono text-xs"><div class="w-10 bg-[#333] flex flex-col py-4 gap-4 items-center"><span>📄</span><span>🔍</span></div><div class="flex-1 p-4 whitespace-pre outline-none" contenteditable="true">function init() {\n  console.log("Welcome to Windows 10 Web");\n}</div></div>`;
              case 'notes':
                  return `<textarea class="w-full h-full p-4 bg-[#fff9c4] border-none outline-none resize-none" placeholder="Take a note..."></textarea>`;
              default: return `<div class="p-4">Content not found.</div>`;
          }
      }

      function focusWindow(appId) {
          const win = document.getElementById(`window-${appId}`);
          if (win) win.style.zIndex = ++zIndexCounter;
      }

      function closeWindow(appId) {
          const win = document.getElementById(`window-${appId}`);
          if (win) {
              win.classList.add('window-minimized');
              setTimeout(() => win.remove(), 200);
          }
      }

      function minimizeWindow(appId) {
          const win = document.getElementById(`window-${appId}`);
          if (win) win.classList.add('window-minimized');
      }

      // Hide splash when app is ready
      window.addEventListener('load', () => {
        setTimeout(() => {
          window.dispatchEvent(new CustomEvent('windesk-ready'));
        }, 800);
      });

      window.addEventListener('windesk-ready', () => {
        const splash = document.getElementById('splash');
        if (splash) {
          splash.classList.add('hidden');
          setTimeout(() => splash.remove(), 500);
        }
      });

      // Simple drag logic (for top handle)
      document.addEventListener('touchstart', (e) => {
          const handle = e.target.closest('.handle');
          if (!handle) {
              if (!startMenu.contains(e.target) && !e.target.closest('.taskbar-icon')) closeStartMenu();
              return;
          }
          const win = handle.parentElement;
          const appId = win.id.replace('window-', '');
          focusWindow(appId);
          
          let touch = e.touches[0];
          let startX = touch.clientX - win.offsetLeft;
          let startY = touch.clientY - win.offsetTop;

          function move(me) {
              let t = me.touches[0];
              win.style.left = (t.clientX - startX) + 'px';
              win.style.top = (t.clientY - startY) + 'px';
              win.style.width = '320px'; // Resizing for easier mobile drag
              win.style.height = '480px';
          }
          function end() {
              document.removeEventListener('touchmove', move);
              document.removeEventListener('touchend', end);
          }
          document.addEventListener('touchmove', move);
          document.addEventListener('touchend', end);
      });
    </script>
  </body>
</html>
</html>

Built: Windows 10 Web Desktop with PWA and Office apps. Next: Taskbar window previews on hover.
