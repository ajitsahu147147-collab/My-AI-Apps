<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="google-site-verification" content="QUqvQ5nNzihxKCtcBWm_VtpudXeHx87Fwvn0qyr9CWg" />
    <title>NEON SURVIVOR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

        * {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            box-sizing: border-box;
            font-family: 'Orbitron', sans-serif;
        }

        html, body {
            overscroll-behavior: none;
            touch-action: none;
            background-color: #0a0a0c;
            color: #ffffff;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        canvas {
            display: block;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }

        button, [role="button"] {
            -webkit-user-select: none;
            user-select: none;
            touch-action: manipulation;
            cursor: pointer;
            transition: transform 0.1s active;
        }

        button:active {
            transform: scale(0.95);
        }

        .neon-glow {
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.8), 0 0 20px rgba(0, 255, 255, 0.4);
        }

        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            background: rgba(10, 10, 12, 0.85);
            backdrop-filter: blur(4px);
        }

        .safe-area-bottom {
            padding-bottom: env(safe-area-inset-bottom);
        }
    </style>
</head>
<body class="flex flex-col items-center justify-between h-screen w-full">

    <!-- Game HUD -->
    <div id="hud" class="absolute top-0 left-0 w-full p-6 flex justify-between items-start z-10 pointer-events-none">
        <div>
            <p class="text-xs uppercase opacity-60 tracking-widest">Score</p>
            <p id="scoreText" class="text-2xl font-bold neon-glow">0</p>
        </div>
        <div class="text-right">
            <p class="text-xs uppercase opacity-60 tracking-widest">Lives</p>
            <div id="livesContainer" class="flex gap-1 justify-end">
                <div class="w-3 h-3 bg-cyan-400 rounded-full shadow-[0_0_8px_cyan]"></div>
                <div class="w-3 h-3 bg-cyan-400 rounded-full shadow-[0_0_8px_cyan]"></div>
                <div class="w-3 h-3 bg-cyan-400 rounded-full shadow-[0_0_8px_cyan]"></div>
            </div>
        </div>
    </div>

    <!-- Start Screen -->
    <div id="startScreen" class="ui-overlay px-8 text-center">
        <h1 class="text-5xl font-bold mb-2 tracking-tighter italic text-cyan-400 neon-glow">NEON</h1>
        <h1 class="text-5xl font-bold mb-8 tracking-tighter italic text-white">SURVIVOR</h1>
        <p class="text-cyan-200/60 text-sm mb-12 max-w-xs">Slide your finger to dodge and auto-fire. Don't let the red voids touch you.</p>
        <button id="startBtn" class="bg-cyan-500 hover:bg-cyan-400 text-black font-bold py-4 px-12 rounded-full text-xl shadow-lg shadow-cyan-500/30">
            START MISSION
        </button>
    </div>

    <!-- Game Over Screen -->
    <div id="gameOverScreen" class="ui-overlay px-8 text-center hidden">
        <h2 class="text-4xl font-bold mb-2 text-red-500">SYSTEM FAILED</h2>
        <p id="finalScore" class="text-xl mb-12">Final Score: 0</p>
        <button id="restartBtn" class="bg-white text-black font-bold py-4 px-12 rounded-full text-xl shadow-lg mb-4 w-full">
            RETRY
        </button>
    </div>

    <!-- Main Canvas -->
    <canvas id="gameCanvas"></canvas>

    <!-- Footer Note -->
    <div class="absolute bottom-4 w-full text-center pointer-events-none opacity-40 text-[10px] tracking-widest safe-area-bottom">
        Built: Neon Survival arcade with Google Indexing. Next: Implement boss battles.
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');
        const scoreText = document.getElementById('scoreText');
        const finalScoreText = document.getElementById('finalScore');
        const livesContainer = document.getElementById('livesContainer');

        let animationId;
        let score = 0;
        let lives = 3;
        let gameActive = false;
        let enemies = [];
        let bullets = [];
        let particles = [];
        let lastEnemySpawn = 0;
        let lastBulletFire = 0;

        const player = {
            x: 0,
            y: 0,
            radius: 20,
            color: '#00f2ff',
            targetX: 0,
            targetY: 0
        };

        // Difficulty Settings (NORMAL)
        const SETTINGS = {
            enemyBaseSpeed: 3.5,
            spawnRate: 800, // ms
            fireRate: 250, // ms
            bulletSpeed: 7
        };

        function init() {
            resize();
            window.addEventListener('resize', resize);
            
            // Interaction
            const handleMove = (e) => {
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                player.targetX = clientX;
                player.targetY = clientY - 40; // Offset for thumb visibility
            };

            canvas.addEventListener('mousemove', handleMove);
            canvas.addEventListener('touchmove', (e) => {
                e.preventDefault();
                handleMove(e);
            }, { passive: false });

            startBtn.addEventListener('click', startGame);
            restartBtn.addEventListener('click', startGame);
        }

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            player.x = canvas.width / 2;
            player.y = canvas.height * 0.8;
            player.targetX = player.x;
            player.targetY = player.y;
        }

        function startGame() {
            score = 0;
            lives = 3;
            enemies = [];
            bullets = [];
            particles = [];
            gameActive = true;
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            updateLivesUI();
            updateScoreUI();
            requestAnimationFrame(gameLoop);
        }

        function updateLivesUI() {
            livesContainer.innerHTML = '';
            for(let i=0; i<lives; i++) {
                const heart = document.createElement('div');
                heart.className = 'w-3 h-3 bg-cyan-400 rounded-full shadow-[0_0_8px_cyan]';
                livesContainer.appendChild(heart);
            }
        }

        function updateScoreUI() {
            scoreText.innerText = score;
        }

        function spawnEnemy() {
            const size = Math.random() * 20 + 20;
            enemies.push({
                x: Math.random() * (canvas.width - size) + size/2,
                y: -size,
                width: size,
                height: size,
                speed: SETTINGS.enemyBaseSpeed + (score / 1000)
            });
        }

        function spawnBullet() {
            bullets.push({
                x: player.x,
                y: player.y - 20,
                radius: 4,
                speed: SETTINGS.bulletSpeed
            });
        }

        function createExplosion(x, y, color) {
            for (let i = 0; i < 8; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    life: 1.0,
                    color
                });
            }
        }

        function gameLoop(timestamp) {
            if (!gameActive) return;

            ctx.fillStyle = 'rgba(10, 10, 12, 0.3)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Interpolate Player movement for smoothness
            player.x += (player.targetX - player.x) * 0.15;
            player.y += (player.targetY - player.y) * 0.15;

            // Draw Player
            ctx.beginPath();
            ctx.shadowBlur = 15;
            ctx.shadowColor = player.color;
            ctx.fillStyle = player.color;
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Shooting logic
            if (timestamp - lastBulletFire > SETTINGS.fireRate) {
                spawnBullet();
                lastBulletFire = timestamp;
            }

            // Enemy Spawning
            if (timestamp - lastEnemySpawn > SETTINGS.spawnRate) {
                spawnEnemy();
                lastEnemySpawn = timestamp;
            }

            // Update Bullets
            bullets.forEach((b, bi) => {
                b.y -= b.speed;
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fill();

                if (b.y < 0) bullets.splice(bi, 1);
            });

            // Update Enemies
            enemies.forEach((e, ei) => {
                e.y += e.speed;
                
                // Draw enemy
                ctx.strokeStyle = '#ff3366';
                ctx.lineWidth = 2;
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#ff3366';
                ctx.strokeRect(e.x - e.width/2, e.y - e.height/2, e.width, e.height);
                ctx.shadowBlur = 0;

                // Collision with player
                const dx = e.x - player.x;
                const dy = e.y - player.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                if (dist < player.radius + e.width/2) {
                    enemies.splice(ei, 1);
                    createExplosion(e.x, e.y, '#ff3366');
                    lives--;
                    updateLivesUI();
                    if (lives <= 0) endGame();
                }

                // Collision with bullets
                bullets.forEach((b, bi) => {
                    if (b.x > e.x - e.width/2 && b.x < e.x + e.width/2 &&
                        b.y > e.y - e.height/2 && b.y < e.y + e.height/2) {
                        createExplosion(e.x, e.y, '#ff3366');
                        enemies.splice(ei, 1);
                        bullets.splice(bi, 1);
                        score += 10;
                        updateScoreUI();
                    }
                });

                if (e.y > canvas.height + 50) enemies.splice(ei, 1);
            });

            // Particles
            particles.forEach((p, pi) => {
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.02;
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.fillRect(p.x, p.y, 3, 3);
                ctx.globalAlpha = 1.0;
                if (p.life <= 0) particles.splice(pi, 1);
            });

            animationId = requestAnimationFrame(gameLoop);
        }

        function endGame() {
            gameActive = false;
            cancelAnimationFrame(animationId);
            finalScoreText.innerText = `Final Score: ${score}`;
            gameOverScreen.classList.remove('hidden');
        }

        init();
    </script>
</body>
</html>
