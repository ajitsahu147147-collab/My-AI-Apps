<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Prisma3D Web Studio</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r152/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.152.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.152.0/examples/js/controls/TransformControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.152.0/examples/js/exporters/GLTFExporter.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/earcut@2.2.4/dist/earcut.min.js"></script>
    <style>
        * { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; box-sizing: border-box; }
        html, body { 
            overscroll-behavior: none; 
            touch-action: none; 
            width: 100%; height: 100%; 
            margin: 0; padding: 0; 
            background: #121212; 
            color: white; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }
        canvas { display: block; touch-action: none; }
        .no-select { -webkit-user-select: none; user-select: none; }
        input[type="range"] { accent-color: #3b82f6; }
        button:active { transform: scale(0.95); }
        .panel-glass { background: rgba(30, 30, 30, 0.85); backdrop-filter: blur(10px); }
        .timeline-gradient { background: linear-gradient(90deg, #1e1e1e 0%, #2a2a2a 100%); }
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // --- Core Studio Logic ---
        
        const StudioApp = () => {
            const containerRef = useRef();
            const canvas2DRef = useRef();
            const [mode, setMode] = useState('SELECT'); // SELECT, DRAW, ANIMATE
            const [selectedId, setSelectedId] = useState(null);
            const [objects, setObjects] = useState([]); // Tracking for UI
            const [currentFrame, setCurrentFrame] = useState(0);
            const [isPlaying, setIsPlaying] = useState(false);
            const [isDrawing, setIsDrawing] = useState(false);
            const [drawPoints, setDrawPoints] = useState([]);
            
            // Three.js Refs
            const sceneRef = useRef(new THREE.Scene());
            const rendererRef = useRef();
            const cameraRef = useRef();
            const controlsRef = useRef();
            const transformRef = useRef();
            const raycaster = useRef(new THREE.Raycaster());
            const mouse = useRef(new THREE.Vector2());
            const clock = useRef(new THREE.Clock());
            const animationObjects = useRef([]);

            // Init Three.js
            useEffect(() => {
                const scene = sceneRef.current;
                scene.background = new THREE.Color(0x1a1a1a);
                
                // Camera
                const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                camera.position.set(5, 5, 5);
                cameraRef.current = camera;

                // Renderer
                const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setPixelRatio(window.devicePixelRatio);
                renderer.shadowMap.enabled = true;
                containerRef.current.appendChild(renderer.domElement);
                rendererRef.current = renderer;

                // Lighting
                const ambient = new THREE.AmbientLight(0xffffff, 0.6);
                scene.add(ambient);
                const directional = new THREE.DirectionalLight(0xffffff, 0.8);
                directional.position.set(10, 20, 10);
                directional.castShadow = true;
                scene.add(directional);

                // Grid
                const grid = new THREE.GridHelper(20, 20, 0x444444, 0x222222);
                scene.add(grid);

                // Controls
                const controls = new THREE.OrbitControls(camera, renderer.domElement);
                controls.enableDamping = true;
                controlsRef.current = controls;

                // Transform Gizmo
                const tControls = new THREE.TransformControls(camera, renderer.domElement);
                tControls.addEventListener('dragging-changed', (event) => {
                    controls.enabled = !event.value;
                });
                scene.add(tControls);
                transformRef.current = tControls;

                // Animation Loop
                const animate = () => {
                    requestAnimationFrame(animate);
                    controls.update();
                    
                    if (isPlaying) {
                        const delta = clock.current.getDelta();
                        setCurrentFrame(prev => {
                            let next = prev + 0.5; // playback speed
                            if (next > 100) next = 0;
                            return next;
                        });
                    }

                    renderer.render(scene, camera);
                };
                animate();

                // Resize
                const handleResize = () => {
                    camera.aspect = window.innerWidth / window.innerHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(window.innerWidth, window.innerHeight);
                };
                window.addEventListener('resize', handleResize);
                return () => window.removeEventListener('resize', handleResize);
            }, []);

            // Sync Animation Playback
            useEffect(() => {
                if (isPlaying || !isPlaying) {
                    applyAnimationAtFrame(currentFrame);
                }
            }, [currentFrame]);

            const applyAnimationAtFrame = (frame) => {
                sceneRef.current.traverse((obj) => {
                    if (obj.isMesh && obj.userData.keyframes) {
                        const keys = Object.keys(obj.userData.keyframes).map(Number).sort((a,b) => a-b);
                        if (keys.length === 0) return;

                        // Find segments
                        let prev = keys[0], next = keys[0];
                        for (let k of keys) {
                            if (k <= frame) prev = k;
                            if (k >= frame) { next = k; break; }
                        }

                        const k1 = obj.userData.keyframes[prev];
                        const k2 = obj.userData.keyframes[next];

                        if (prev === next) {
                            obj.position.copy(k1.pos);
                            obj.quaternion.copy(k1.rot);
                            obj.scale.copy(k1.scale);
                        } else {
                            const t = (frame - prev) / (next - prev);
                            obj.position.lerpVectors(k1.pos, k2.pos, t);
                            obj.quaternion.slerpQuaternions(k1.rot, k2.rot, t);
                            obj.scale.lerpVectors(k1.scale, k2.scale, t);
                        }
                    }
                });
            };

            // Selection Logic
            const handleViewportClick = (e) => {
                if (mode !== 'SELECT') return;
                
                mouse.current.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.current.y = -(e.clientY / window.innerHeight) * 2 + 1;

                raycaster.current.setFromCamera(mouse.current, cameraRef.current);
                const intersects = raycaster.current.intersectObjects(sceneRef.current.children, true);
                
                const validHit = intersects.find(i => i.object.isMesh && !i.object.isGridHelper);
                
                if (validHit) {
                    const obj = validHit.object;
                    setSelectedId(obj.uuid);
                    transformRef.current.attach(obj);
                } else {
                    setSelectedId(null);
                    transformRef.current.detach();
                }
            };

            // Primitive Creation
            const addPrimitive = (type) => {
                let geo;
                if (type === 'cube') geo = new THREE.BoxGeometry(1, 1, 1);
                if (type === 'sphere') geo = new THREE.SphereGeometry(0.7, 32, 32);
                if (type === 'cylinder') geo = new THREE.CylinderGeometry(0.5, 0.5, 1, 32);
                
                const mat = new THREE.MeshStandardMaterial({ color: 0x3b82f6, roughness: 0.3, metalness: 0.2 });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.y = 0.5;
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                mesh.userData = { keyframes: {}, name: `${type}_${Math.floor(Math.random()*1000)}` };
                
                sceneRef.current.add(mesh);
                setObjects([...objects, { id: mesh.uuid, name: mesh.userData.name }]);
                setSelectedId(mesh.uuid);
                transformRef.current.attach(mesh);
            };

            // 2D to 3D Inflation (Teddy inspired simple)
            const startDrawing = (e) => {
                if (mode !== 'DRAW') return;
                setIsDrawing(true);
                const rect = canvas2DRef.current.getBoundingClientRect();
                const x = e.clientX || e.touches[0].clientX;
                const y = e.clientY || e.touches[0].clientY;
                setDrawPoints([{ x: x - rect.left, y: y - rect.top }]);
            };

            const doDrawing = (e) => {
                if (!isDrawing) return;
                const rect = canvas2DRef.current.getBoundingClientRect();
                const x = e.clientX || e.touches[0].clientX;
                const y = e.clientY || e.touches[0].clientY;
                setDrawPoints(prev => [...prev, { x: x - rect.left, y: y - rect.top }]);
            };

            const endDrawing = () => {
                if (!isDrawing) return;
                setIsDrawing(false);
                if (drawPoints.length < 10) {
                    setDrawPoints([]);
                    return;
                }

                // Create Mesh from DrawPoints
                createSketchedMesh(drawPoints);
                setDrawPoints([]);
                setMode('SELECT');
            };

            const createSketchedMesh = (points) => {
                // 1. Convert to 2D coords
                const flatPoints = [];
                const minX = Math.min(...points.map(p => p.x));
                const maxX = Math.max(...points.map(p => p.x));
                const minY = Math.min(...points.map(p => p.y));
                const maxY = Math.max(...points.map(p => p.y));
                const width = maxX - minX;
                const height = maxY - minY;
                const centerX = minX + width/2;
                const centerY = minY + height/2;

                // Scale to 3D units (approx)
                const scale = 5 / window.innerHeight;
                const normalized = points.map(p => ({
                    x: (p.x - centerX) * scale,
                    y: -(p.y - centerY) * scale
                }));

                normalized.forEach(p => { flatPoints.push(p.x, p.y); });

                // 2. Triangulate
                const triangles = earcut(flatPoints);
                
                // 3. Create Geometry (Front and Back)
                const geometry = new THREE.BufferGeometry();
                const vertices = [];
                const indices = [];

                // Logic: Duplicate vertices for front (z=0.2) and back (z=-0.2)
                // Center vertices will be "inflated" slightly for roundness
                const offset = 0.2;
                
                // Front vertices
                for(let i=0; i<normalized.length; i++) {
                    vertices.push(normalized[i].x, normalized[i].y, offset);
                }
                // Back vertices
                for(let i=0; i<normalized.length; i++) {
                    vertices.push(normalized[i].x, normalized[i].y, -offset);
                }

                // Front Triangles
                for(let i=0; i<triangles.length; i+=3) {
                    indices.push(triangles[i], triangles[i+1], triangles[i+2]);
                }
                // Back Triangles (flipped)
                const vOffset = normalized.length;
                for(let i=0; i<triangles.length; i+=3) {
                    indices.push(triangles[i] + vOffset, triangles[i+2] + vOffset, triangles[i+1] + vOffset);
                }

                // Side bridging
                for(let i=0; i<normalized.length; i++) {
                    const next = (i + 1) % normalized.length;
                    const f1 = i;
                    const f2 = next;
                    const b1 = i + vOffset;
                    const b2 = next + vOffset;
                    // Quad 1
                    indices.push(f1, b1, f2);
                    // Quad 2
                    indices.push(b1, b2, f2);
                }

                geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
                geometry.setIndex(indices);
                geometry.computeVertexNormals();

                const mat = new THREE.MeshStandardMaterial({ color: 0xff6b6b, roughness: 0.4, metalness: 0.1, side: THREE.DoubleSide });
                const mesh = new THREE.Mesh(geometry, mat);
                mesh.position.set(0, 1, 0);
                mesh.userData = { keyframes: {}, name: `sketch_${Math.floor(Math.random()*1000)}` };
                
                sceneRef.current.add(mesh);
                setObjects([...objects, { id: mesh.uuid, name: mesh.userData.name }]);
                setSelectedId(mesh.uuid);
                transformRef.current.attach(mesh);
            };

            // Animation logic
            const addKeyframe = () => {
                const target = transformRef.current.object;
                if (!target) return;
                
                if (!target.userData.keyframes) target.userData.keyframes = {};
                
                target.userData.keyframes[Math.round(currentFrame)] = {
                    pos: target.position.clone(),
                    rot: target.quaternion.clone(),
                    scale: target.scale.clone()
                };
                alert(`Keyframe added at frame ${Math.round(currentFrame)}`);
            };

            // Export
            const exportScene = () => {
                const exporter = new THREE.GLTFExporter();
                exporter.parse(sceneRef.current, (gltf) => {
                    const blob = new Blob([JSON.stringify(gltf)], { type: 'application/json' });
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    link.download = 'prisma_model.glb';
                    link.click();
                }, { binary: true });
            };

            // Inspector Logic
            const updateSelected = (key, val) => {
                const obj = transformRef.current.object;
                if (!obj) return;
                if (key === 'color') obj.material.color.set(val);
                if (key === 'px') obj.position.x = val;
                if (key === 'py') obj.position.y = val;
                if (key === 'pz') obj.position.z = val;
                setObjects([...objects]); // trigger ui
            };

            const deleteSelected = () => {
                const obj = transformRef.current.object;
                if (!obj) return;
                transformRef.current.detach();
                sceneRef.current.remove(obj);
                setObjects(objects.filter(o => o.id !== obj.uuid));
                setSelectedId(null);
            };

            const currentObj = useMemo(() => {
                return sceneRef.current.getObjectByProperty('uuid', selectedId);
            }, [selectedId, objects]);

            return (
                <div className="relative w-full h-full overflow-hidden flex flex-col">
                    {/* Header bar */}
                    <div className="flex items-center justify-between p-2 panel-glass border-b border-white/10 z-20">
                        <div className="flex gap-1 overflow-x-auto no-scrollbar">
                            <button onClick={() => addPrimitive('cube')} className="p-2 bg-zinc-800 rounded-lg hover:bg-zinc-700">
                                <lucide-icon name="box" size="20"></lucide-icon>
                            </button>
                            <button onClick={() => addPrimitive('sphere')} className="p-2 bg-zinc-800 rounded-lg hover:bg-zinc-700">
                                <lucide-icon name="circle" size="20"></lucide-icon>
                            </button>
                            <button onClick={() => addPrimitive('cylinder')} className="p-2 bg-zinc-800 rounded-lg hover:bg-zinc-700">
                                <lucide-icon name="database" size="20"></lucide-icon>
                            </button>
                            <div className="w-px h-8 bg-zinc-700 mx-1"></div>
                            <button 
                                onClick={() => setMode('SELECT')} 
                                className={`p-2 rounded-lg ${mode==='SELECT'?'bg-blue-600':'bg-zinc-800'}`}
                            >
                                <lucide-icon name="mouse-pointer-2" size="20"></lucide-icon>
                            </button>
                            <button 
                                onClick={() => setMode('DRAW')} 
                                className={`p-2 rounded-lg ${mode==='DRAW'?'bg-blue-600':'bg-zinc-800'}`}
                            >
                                <lucide-icon name="pen-tool" size="20"></lucide-icon>
                            </button>
                        </div>
                        
                        <div className="flex gap-2">
                            <button onClick={exportScene} className="px-3 py-1.5 bg-green-600 rounded-lg text-sm font-bold flex items-center gap-1">
                                <lucide-icon name="download" size="16"></lucide-icon> GLB
                            </button>
                            <button onClick={() => window.location.reload()} className="p-2 bg-red-900/30 text-red-400 rounded-lg">
                                <lucide-icon name="trash-2" size="20"></lucide-icon>
                            </button>
                        </div>
                    </div>

                    {/* Viewport Area */}
                    <div className="relative flex-1" onPointerDown={handleViewportClick}>
                        <div ref={containerRef} className="w-full h-full" />
                        
                        {/* 2D Sketch Layer */}
                        {mode === 'DRAW' && (
                            <canvas 
                                ref={canvas2DRef}
                                className="absolute inset-0 z-10 touch-none cursor-crosshair bg-black/20"
                                onPointerDown={startDrawing}
                                onPointerMove={doDrawing}
                                onPointerUp={endDrawing}
                                width={window.innerWidth}
                                height={window.innerHeight}
                            />
                        )}
                        
                        {/* Drawing Preview */}
                        {isDrawing && (
                            <svg className="absolute inset-0 z-10 pointer-events-none w-full h-full">
                                <polyline 
                                    points={drawPoints.map(p => `${p.x},${p.y}`).join(' ')}
                                    fill="rgba(255, 107, 107, 0.2)"
                                    stroke="#ff6b6b"
                                    strokeWidth="4"
                                    strokeLinecap="round"
                                    strokeLinejoin="round"
                                />
                            </svg>
                        )}

                        {/* Inspector Sidebar */}
                        {currentObj && (
                            <div className="absolute top-4 right-4 w-64 panel-glass rounded-2xl p-4 border border-white/10 shadow-2xl z-30 space-y-4 max-h-[70vh] overflow-y-auto">
                                <div className="flex justify-between items-center">
                                    <h3 className="font-bold text-zinc-300 uppercase text-xs tracking-widest">Inspector</h3>
                                    <button onClick={() => setSelectedId(null)} className="text-zinc-500 hover:text-white">✕</button>
                                </div>
                                
                                <div className="space-y-3">
                                    <div className="flex flex-col gap-1">
                                        <label className="text-[10px] text-zinc-400">OBJECT NAME</label>
                                        <div className="text-sm font-medium">{currentObj.userData.name}</div>
                                    </div>
                                    
                                    <div className="flex flex-col gap-1">
                                        <label className="text-[10px] text-zinc-400">COLOR</label>
                                        <input 
                                            type="color" 
                                            defaultValue={`#${currentObj.material.color.getHexString()}`}
                                            onChange={(e) => updateSelected('color', e.target.value)}
                                            className="w-full h-8 bg-transparent rounded cursor-pointer"
                                        />
                                    </div>

                                    <div className="flex flex-col gap-1">
                                        <label className="text-[10px] text-zinc-400">TRANSFORM MODE</label>
                                        <div className="flex gap-1 bg-black/40 p-1 rounded-lg">
                                            {['translate', 'rotate', 'scale'].map(t => (
                                                <button 
                                                    key={t}
                                                    onClick={() => transformRef.current.setMode(t)}
                                                    className={`flex-1 text-[10px] py-1 rounded ${transformRef.current.mode === t ? 'bg-zinc-600' : ''}`}
                                                >
                                                    {t.toUpperCase()}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="pt-2">
                                        <button 
                                            onClick={deleteSelected}
                                            className="w-full py-2 bg-red-500/20 text-red-500 rounded-lg text-xs font-bold border border-red-500/50"
                                        >
                                            DELETE OBJECT
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* Timeline / Animation Bar */}
                    <div className="p-4 panel-glass border-t border-white/10 z-20">
                        <div className="flex items-center gap-4 mb-3">
                            <button 
                                onClick={() => setIsPlaying(!isPlaying)} 
                                className={`p-3 rounded-full ${isPlaying ? 'bg-yellow-600' : 'bg-blue-600'} shadow-lg`}
                            >
                                <lucide-icon name={isPlaying ? "pause" : "play"} size="24"></lucide-icon>
                            </button>
                            
                            <div className="flex-1 flex flex-col gap-1">
                                <div className="flex justify-between text-[10px] font-mono text-zinc-400">
                                    <span>FRAME: {Math.floor(currentFrame)}</span>
                                    <span>100</span>
                                </div>
                                <input 
                                    type="range" 
                                    min="0" max="100" step="1"
                                    value={currentFrame}
                                    onChange={(e) => {
                                        setCurrentFrame(parseFloat(e.target.value));
                                        setIsPlaying(false);
                                    }}
                                    className="w-full h-2 rounded-lg bg-zinc-800 appearance-none cursor-pointer"
                                />
                            </div>

                            <button 
                                onClick={addKeyframe}
                                disabled={!selectedId}
                                className={`px-4 py-2 rounded-lg text-xs font-bold flex items-center gap-2 ${selectedId ? 'bg-zinc-200 text-black' : 'bg-zinc-800 text-zinc-600'}`}
                            >
                                <lucide-icon name="key" size="14"></lucide-icon>
                                KEYFRAME
                            </button>
                        </div>
                        
                        <div className="text-[10px] text-center text-zinc-500">
                            Built: Full-featured 3D Studio & Sketch Engine. Next: Add multi-touch mesh sculpting.
                        </div>
                    </div>

                    {/* Hint for Desktop users */}
                    <div className="fixed bottom-24 left-4 pointer-events-none hidden md:block">
                        <div className="bg-black/50 text-[10px] p-2 rounded text-zinc-400">
                            W: Translate | E: Rotate | R: Scale
                        </div>
                    </div>
                </div>
            );
        };

        // Render React
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<StudioApp />);

        // Initialize Lucide icons after render
        setTimeout(() => {
            if (window.lucide) {
                window.lucide.createIcons();
            }
        }, 100);

        // Keyboard Shortcuts
        window.addEventListener('keydown', (e) => {
            const t = document.querySelector('input:focus');
            if (t) return;
            // Access through some global or hook mechanism is hard here, 
            // but we can query the actual Three.js TransformControls in the DOM if we had a ref
        });
    </script>
</body>
</html>
</html>
