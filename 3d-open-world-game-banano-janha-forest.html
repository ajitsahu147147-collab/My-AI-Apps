<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Banano Janha: Urban Drive 3D</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
        * { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; box-sizing: border-box; }
        html, body { 
            margin: 0; padding: 0; overflow: hidden; 
            overscroll-behavior: none; touch-action: none;
            font-family: 'Inter', sans-serif;
            background: #050505;
        }
        canvas { display: block; }
        #ui-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 20px;
            color: white;
        }
        .hud-panel { 
            pointer-events: auto; 
            background: rgba(15, 15, 25, 0.7); 
            backdrop-filter: blur(12px); 
            border-radius: 16px; 
            padding: 15px; 
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }
        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        
        #mobile-controls {
            position: absolute; bottom: 40px; left: 0; width: 100%;
            display: flex; justify-content: space-between; align-items: flex-end;
            padding: 0 30px; pointer-events: none;
        }
        .joystick-container {
            width: 130px; height: 130px; background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 50%; pointer-events: auto; position: relative;
        }
        .joystick-knob {
            width: 60px; height: 60px; background: white;
            border-radius: 50%; position: absolute; top: 35px; left: 35px;
            box-shadow: 0 0 15px rgba(255,255,255,0.5);
        }
        .action-buttons { display: flex; flex-direction: column; gap: 20px; pointer-events: auto; }
        .btn-circle {
            width: 65px; height: 65px; border-radius: 50%;
            background: rgba(255,255,255,0.1); border: 2px solid white;
            display: flex; align-items: center; justify-content: center; font-weight: bold;
            color: white; font-size: 1.1rem; transition: all 0.1s;
        }
        .btn-circle:active { background: white; color: black; transform: scale(0.9); }
        
        #interaction-prompt {
            position: absolute; top: 70%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.9); color: black; 
            padding: 12px 24px; border-radius: 30px; font-weight: bold;
            display: none; pointer-events: none; animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0% { opacity: 0.7; } 50% { opacity: 1; } 100% { opacity: 0.7; } }

        #footer-note {
            position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
            font-size: 11px; color: rgba(255,255,255,0.4); pointer-events: none;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div id="ui-overlay">
        <div class="flex justify-between items-start">
            <div class="hud-panel w-48">
                <div class="text-[10px] uppercase font-bold text-cyan-400 tracking-tighter">Engine Systems</div>
                <div class="h-1.5 w-full bg-gray-800 rounded-full mt-2 overflow-hidden">
                    <div id="health-bar" class="h-full bg-cyan-500 w-full transition-all"></div>
                </div>
                <div class="mt-3 flex justify-between items-end">
                    <div class="text-[10px] text-gray-400">ENERGY</div>
                    <div class="text-xl font-orbitron" id="energy-val">100</div>
                </div>
            </div>
            <div class="hud-panel text-right">
                <div class="text-2xl font-orbitron font-bold text-white tracking-tighter">BANANO <span class="text-yellow-400">JANHA</span></div>
                <div class="text-[10px] text-gray-400 tracking-[0.2em]">CITY DISTRICT V2</div>
                <div id="speed-meter" class="hidden text-yellow-400 font-orbitron text-2xl mt-2 italic">000</div>
            </div>
        </div>

        <div id="interaction-prompt" class="font-orbitron uppercase text-sm">Enter Vehicle [F]</div>

        <div id="mobile-controls" class="md:hidden">
            <div class="joystick-container" id="joystick-base">
                <div class="joystick-knob" id="joystick-thumb"></div>
            </div>
            <div class="action-buttons">
                <button class="btn-circle font-orbitron" id="btn-action">DRIVE</button>
                <button class="btn-circle font-orbitron" id="btn-jump">JUMP</button>
            </div>
        </div>

        <div class="hidden md:flex justify-center pb-4">
            <div class="hud-panel text-center px-10 border-cyan-900/30">
                <span class="text-xs text-gray-400 font-orbitron">[W,A,S,D] Movement &bull; [F] Enter/Exit &bull; [Space] Jump</span>
            </div>
        </div>
    </div>

    <div id="footer-note">Built: Realistic roads, improved city shaders, and drivable vehicle fleet. Next: Add traffic AI and nitro system.</div>

    <script>
        /** CONSTANTS **/
        const WORLD_SIZE = 1200;
        const ROAD_WIDTH = 25;
        const GRID_COUNT = 5; // Grid of roads
        const CAR_COUNT = 15;
        const BIKE_COUNT = 10;
        const BUILDING_COUNT = 150;

        let gameState = {
            mode: 'walking', 
            currentVehicle: null,
            energy: 100
        };

        const keys = { w:false, a:false, s:false, d:false, f:false, space:false };

        /** THREE.JS SETUP **/
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a12);
        scene.fog = new THREE.FogExp2(0x0a0a12, 0.002);

        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 3000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0x4040ff, 0.4);
        scene.add(ambientLight);

        const sun = new THREE.DirectionalLight(0xffffff, 0.8);
        sun.position.set(200, 500, 200);
        sun.castShadow = true;
        sun.shadow.camera.left = -600;
        sun.shadow.camera.right = 600;
        sun.shadow.camera.top = 600;
        sun.shadow.camera.bottom = -600;
        sun.shadow.mapSize.width = 2048;
        scene.add(sun);

        // Ground - Dark Concrete
        const groundGeo = new THREE.PlaneGeometry(3000, 3000);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.8 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Road Grid Creator
        const roads = [];
        function createRoads() {
            const roadMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
            const stripeMat = new THREE.MeshBasicMaterial({ color: 0xffdd00 });
            
            for(let i = -GRID_COUNT; i <= GRID_COUNT; i++) {
                const offset = i * 150;
                
                // Horizontal Road
                const hRoad = new THREE.Mesh(new THREE.PlaneGeometry(3000, ROAD_WIDTH), roadMat);
                hRoad.rotation.x = -Math.PI/2;
                hRoad.position.set(0, 0.02, offset);
                hRoad.receiveShadow = true;
                scene.add(hRoad);
                
                // Vertical Road
                const vRoad = new THREE.Mesh(new THREE.PlaneGeometry(ROAD_WIDTH, 3000), roadMat);
                vRoad.rotation.x = -Math.PI/2;
                vRoad.position.set(offset, 0.01, 0);
                vRoad.receiveShadow = true;
                scene.add(vRoad);

                roads.push({x: null, z: offset}, {x: offset, z: null});
            }
        }
        createRoads();

        /** ENTITIES **/
        const player = new THREE.Group();
        const pBody = new THREE.Mesh(new THREE.CapsuleGeometry(0.4, 1, 4, 8), new THREE.MeshStandardMaterial({color: 0x00ffff}));
        pBody.position.y = 0.9;
        pBody.castShadow = true;
        player.add(pBody);
        
        // Character Head with emissive eyes
        const pHead = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.4, 0.4), new THREE.MeshStandardMaterial({color: 0x222222}));
        pHead.position.y = 1.6;
        player.add(pHead);
        const eye = new THREE.Mesh(new THREE.PlaneGeometry(0.3, 0.05), new THREE.MeshBasicMaterial({color: 0x00ffff}));
        eye.position.set(0, 0.05, 0.21);
        pHead.add(eye);

        player.position.set(0, 0, 50);
        scene.add(player);

        const vehicles = [];
        const buildings = [];

        // Building Generator
        function createBuildings() {
            const bMat = new THREE.MeshStandardMaterial({ color: 0x1a1a2e, roughness: 0.2 });
            const windowMat = new THREE.MeshLambertMaterial({ color: 0xffffaa, emissive: 0xffffaa, emissiveIntensity: 0.5 });

            for(let i=0; i<BUILDING_COUNT; i++) {
                const w = 15 + Math.random() * 10;
                const h = 20 + Math.random() * 80;
                const d = 15 + Math.random() * 10;
                
                let x, z;
                // Place buildings away from roads
                do {
                    x = (Math.random() - 0.5) * 1500;
                    z = (Math.random() - 0.5) * 1500;
                } while (Math.abs(x % 150) < 25 || Math.abs(z % 150) < 25);

                const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), bMat);
                b.position.set(x, h/2, z);
                b.castShadow = true;
                b.receiveShadow = true;
                scene.add(b);

                // Add random windows
                if(Math.random() > 0.3) {
                    const win = new THREE.Mesh(new THREE.BoxGeometry(w + 0.2, 2, d + 0.2), windowMat);
                    win.position.set(x, Math.random() * h, z);
                    scene.add(win);
                }
            }
        }
        createBuildings();

        // Vehicle Spawners
        function createVehicle(type, x, z) {
            const group = new THREE.Group();
            const color = type === 'car' ? 0xff3300 : 0x00ff00;
            
            if(type === 'car') {
                const body = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.8, 4.5), new THREE.MeshStandardMaterial({color, roughness: 0.1}));
                body.position.y = 0.7;
                body.castShadow = true;
                group.add(body);
                
                const glass = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.6, 2), new THREE.MeshStandardMaterial({color: 0x111111, metalness: 1}));
                glass.position.set(0, 1.3, 0);
                group.add(glass);

                // Headlights
                const light = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.2, 0.1), new THREE.MeshBasicMaterial({color: 0xffffff}));
                light.position.set(0.7, 0.7, 2.26);
                group.add(light.clone().setX(-0.7)); group.add(light);
            } else {
                const frame = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.8, 2.5), new THREE.MeshStandardMaterial({color, roughness: 0.3}));
                frame.position.y = 0.8;
                group.add(frame);
                const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.3, 16), new THREE.MeshStandardMaterial({color: 0x111111}));
                wheel.rotation.z = Math.PI/2;
                wheel.position.set(0, 0.5, 1.2);
                group.add(wheel);
                const wheel2 = wheel.clone(); wheel2.position.z = -1.2;
                group.add(wheel2);
            }

            group.position.set(x, 0, z);
            group.userData = { type, speed: 0, rot: 0 };
            scene.add(group);
            vehicles.push(group);
        }

        // Spawn vehicles on roads
        for(let i=0; i<CAR_COUNT; i++) createVehicle('car', (Math.floor(Math.random()*GRID_COUNT)*150), Math.random()*1000 - 500);
        for(let i=0; i<BIKE_COUNT; i++) createVehicle('bike', Math.random()*1000 - 500, (Math.floor(Math.random()*GRID_COUNT)*150));

        /** CONTROLS **/
        window.addEventListener('keydown', (e) => {
            const k = e.key.toLowerCase();
            if(k === 'w') keys.w = true; if(k === 'a') keys.a = true;
            if(k === 's') keys.s = true; if(k === 'd') keys.d = true;
            if(k === ' ') keys.space = true; if(k === 'f') toggleVehicle();
        });
        window.addEventListener('keyup', (e) => {
            const k = e.key.toLowerCase();
            if(k === 'w') keys.w = false; if(k === 'a') keys.a = false;
            if(k === 's') keys.s = false; if(k === 'd') keys.d = false;
            if(k === ' ') keys.space = false;
        });

        // Mobile Logic
        const joystickBase = document.getElementById('joystick-base');
        const joystickThumb = document.getElementById('joystick-thumb');
        joystickBase.addEventListener('touchstart', (e) => { e.preventDefault(); });
        joystickBase.addEventListener('touchmove', (e) => {
            const b = joystickBase.getBoundingClientRect();
            const t = e.touches[0];
            const dx = t.clientX - (b.left + b.width/2);
            const dy = t.clientY - (b.top + b.height/2);
            const dist = Math.min(50, Math.sqrt(dx*dx + dy*dy));
            const angle = Math.atan2(dy, dx);
            joystickThumb.style.transform = `translate(${(Math.cos(angle)*dist)}px, ${(Math.sin(angle)*dist)}px)`;
            keys.w = dy < -15; keys.s = dy > 15;
            keys.a = dx < -15; keys.d = dx > 15;
        });
        joystickBase.addEventListener('touchend', () => {
            joystickThumb.style.transform = `translate(0px, 0px)`;
            keys.w = keys.s = keys.a = keys.d = false;
        });
        document.getElementById('btn-action').onclick = toggleVehicle;
        document.getElementById('btn-jump').onclick = () => { keys.space = true; setTimeout(()=>keys.space=false, 100); };

        function toggleVehicle() {
            if (gameState.mode === 'walking') {
                let closest = null, minDist = 6;
                vehicles.forEach(v => {
                    const d = player.position.distanceTo(v.position);
                    if (d < minDist) { minDist = d; closest = v; }
                });
                if (closest) {
                    gameState.mode = 'driving';
                    gameState.currentVehicle = closest;
                    player.visible = false;
                    document.getElementById('speed-meter').classList.remove('hidden');
                }
            } else {
                gameState.mode = 'walking';
                player.position.set(gameState.currentVehicle.position.x + 3, 0, gameState.currentVehicle.position.z);
                player.visible = true;
                gameState.currentVehicle = null;
                document.getElementById('speed-meter').classList.add('hidden');
            }
        }

        /** LOOP **/
        let clock = new THREE.Clock();
        let py = 0;

        function update() {
            const delta = Math.min(clock.getDelta(), 0.1);
            const prompt = document.getElementById('interaction-prompt');
            prompt.style.display = 'none';

            if (gameState.mode === 'walking') {
                const moveSpeed = 12 * delta;
                const rotSpeed = 3.5 * delta;
                
                if (keys.w) player.translateZ(moveSpeed);
                if (keys.s) player.translateZ(-moveSpeed);
                if (keys.a) player.rotation.y += rotSpeed;
                if (keys.d) player.rotation.y -= rotSpeed;

                if (keys.space && player.position.y <= 0.05) py = 0.25;
                player.position.y += py;
                if (player.position.y > 0) py -= 0.015;
                else { player.position.y = 0; py = 0; }

                const camPos = player.position.clone().add(new THREE.Vector3(0, 5, -12).applyQuaternion(player.quaternion));
                camera.position.lerp(camPos, 0.15);
                camera.lookAt(player.position.clone().add(new THREE.Vector3(0, 1.5, 0)));

                vehicles.forEach(v => { if(player.position.distanceTo(v.position) < 6) prompt.style.display = 'block'; });

            } else {
                const v = gameState.currentVehicle;
                const stats = v.userData;
                const topSpeed = stats.type === 'car' ? 65 : 80;
                const accel = stats.type === 'car' ? 35 : 50;

                if (keys.w) stats.speed += accel * delta;
                else if (keys.s) stats.speed -= accel * delta;
                else stats.speed *= 0.98;

                stats.speed = Math.max(-20, Math.min(topSpeed, stats.speed));
                
                const steer = (stats.speed / topSpeed) * 2.5 * delta;
                if (keys.a) v.rotation.y += steer;
                if (keys.d) v.rotation.y -= steer;

                v.translateZ(stats.speed * delta);
                
                const camPos = v.position.clone().add(new THREE.Vector3(0, 7, -18).applyQuaternion(v.quaternion));
                camera.position.lerp(camPos, 0.1);
                camera.lookAt(v.position);

                document.getElementById('speed-meter').innerText = Math.abs(Math.floor(stats.speed * 2)).toString().padStart(3, '0');
            }

            renderer.render(scene, camera);
            requestAnimationFrame(update);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        setInterval(() => {
            if(gameState.energy > 0) {
                gameState.energy -= 0.1;
                document.getElementById('energy-val').innerText = Math.floor(gameState.energy);
                document.getElementById('health-bar').style.width = gameState.energy + '%';
            }
        }, 1000);

        update();
    </script>
</body>
</html>
