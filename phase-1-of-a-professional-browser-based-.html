<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ShapeForge 3D Studio - PWA Edition</title>
    
    <!-- PWA / Mobile Web App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#080B12">
    <meta name="mobile-web-app-capable" content="yes">
    
    <!-- Web App Icon (SVG Data URI) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='128' fill='%23080B12'/%3E%3Cpath d='M256 120 L400 200 L400 360 L256 440 L112 360 L112 200 Z' fill='none' stroke='%237C83FF' stroke-width='30'/%3E%3Cpath d='M256 120 L256 280 L400 360 M256 280 L112 360' fill='none' stroke='%237C83FF' stroke-width='20' opacity='0.6'/%3E%3C/svg%3E">
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='128' fill='%23080B12'/%3E%3Cpath d='M256 120 L400 200 L400 360 L256 440 L112 360 L112 200 Z' fill='none' stroke='%237C83FF' stroke-width='30'/%3E%3Cpath d='M256 120 L256 280 L400 360 M256 280 L112 360' fill='none' stroke='%237C83FF' stroke-width='20' opacity='0.6'/%3E%3C/svg%3E">
    
    <!-- Web App Manifest (Data URI for Single-File App) -->
    <link rel="manifest" href='data:application/manifest+json,{"name":"ShapeForge 3D Studio","short_name":"ShapeForge","start_url":".","display":"standalone","background_color":"%23080B12","theme_color":"%237C83FF","icons":[{"src":"data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 512 512%27%3E%3Crect width=%27512%27 height=%27512%27 rx=%27128%27 fill=%27%23080B12%27/%3E%3Cpath d=%27M256 120 L400 200 L400 360 L256 440 L112 360 L112 200 Z%27 fill=%27none%27 stroke=%27%237C83FF%27 stroke-width=%2730%27/%3E%3Cpath d=%27M256 120 L256 280 L400 360 M256 280 L112 360%27 fill=%27none%27 stroke=%27%237C83FF%27 stroke-width=%2720%27 opacity=%270.6%27/%3E%3C/svg%3E","sizes":"512x512","type":"image/svg+xml"}]}'>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        :root {
            --bg-primary: #080B12;
            --bg-secondary: #0E131D;
            --panel: #151C29;
            --border: #273149;
            --text-primary: #F2F5FF;
            --text-secondary: #8D98AE;
            --accent: #7C83FF;
            --accent-glow: rgba(124, 131, 255, 0.4);
            --danger: #FF4757;
            --warning: #FFB86C;
            --success: #50FA7B;
            --timeline-height: 180px;
        }

        * {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            box-sizing: border-box;
            user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            overscroll-behavior: none;
            touch-action: manipulation;
        }

        input, textarea, select {
            user-select: text;
            -webkit-user-select: text;
        }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: var(--bg-primary); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

        .sf-panel { background: var(--panel); border: 1px solid var(--border); }

        .sf-btn {
            height: 36px;
            min-width: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            transition: all 0.15s ease;
            cursor: pointer;
            color: var(--text-secondary);
        }
        .sf-btn:hover:not(:disabled) { background: var(--border); color: var(--text-primary); }
        .sf-btn.active { background: var(--accent); color: white; }
        .sf-btn:disabled { opacity: 0.2; cursor: not-allowed; }

        .sf-accent-btn { background: var(--accent); color: white; border: none; }
        
        .dropdown-menu {
            display: none;
            position: absolute;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            min-width: 180px;
            z-index: 1000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            padding: 4px;
        }
        
        .menu-item:hover > .dropdown-menu { display: block; }
        .menu-btn {
            width: 100%;
            text-align: left;
            padding: 6px 10px;
            font-size: 11px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--text-secondary);
        }
        .menu-btn:hover { background: var(--border); color: var(--text-primary); }

        .sf-sidebar { width: 48px; flex-shrink: 0; border-right: 1px solid var(--border); }
        .sf-inspector { width: 280px; flex-shrink: 0; border-left: 1px solid var(--border); }

        #viewport-container {
            flex-grow: 1;
            position: relative;
            background: #000;
            touch-action: none;
            overflow: hidden;
        }

        .mode-selector {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            background: rgba(14, 19, 29, 0.9);
            border: 1px solid var(--border);
            padding: 3px;
            border-radius: 6px;
            backdrop-filter: blur(10px);
            z-index: 40;
        }

        .mode-btn {
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-secondary);
        }
        .mode-btn.active { background: var(--accent); color: white; }

        #timeline-panel {
            height: var(--timeline-height);
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }

        .timeline-header {
            height: 32px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 8px;
            gap: 8px;
            font-size: 10px;
        }

        .timeline-content { flex-grow: 1; display: flex; overflow: hidden; position: relative; }
        .timeline-tracks { width: 150px; border-right: 1px solid var(--border); background: var(--bg-primary); }
        .timeline-grid { flex-grow: 1; overflow-x: auto; background: var(--bg-primary); position: relative; }

        .playhead {
            position: absolute;
            top: 0; bottom: 0;
            width: 1px;
            background: var(--danger);
            z-index: 20;
            pointer-events: none;
        }

        .app-footer { background: var(--bg-primary); border-top: 1px solid var(--border); height: 24px; }

        @media (max-width: 768px) {
            .sf-inspector { display: none; }
            .sf-sidebar { 
                position: absolute; 
                bottom: calc(var(--timeline-height) + 12px); 
                left: 12px;
                height: auto;
                background: rgba(21, 28, 41, 0.8);
                backdrop-filter: blur(8px);
                border-radius: 8px;
                border: 1px solid var(--border);
                width: 44px;
                padding: 4px 0;
            }
        }
    </style>
</head>
<body>

    <!-- LOADING / WELCOME SCREEN -->
    <div id="welcome-screen" class="fixed inset-0 z-[9999] bg-[var(--bg-primary)] flex flex-col items-center justify-center p-8 text-center">
        <div class="mb-10 flex flex-col items-center">
            <div class="w-20 h-20 mb-6 bg-[var(--panel)] border-2 border-[var(--accent)] rounded-2xl flex items-center justify-center shadow-[0_0_30px_rgba(124,131,255,0.2)]">
                <svg viewBox="0 0 512 512" class="w-12 h-12">
                    <path d="M256 120 L400 200 L400 360 L256 440 L112 360 L112 200 Z" fill="none" stroke="#7C83FF" stroke-width="30"/>
                    <path d="M256 120 L256 280 L400 360 M256 280 L112 360" fill="none" stroke="#7C83FF" stroke-width="20" opacity="0.6"/>
                </svg>
            </div>
            <h1 class="text-4xl font-black tracking-tighter mb-1 italic">SHAPE<span class="text-[var(--accent)]">FORGE</span> 3D</h1>
            <p class="text-[var(--text-secondary)] text-[10px] uppercase tracking-[0.4em]">Professional Studio</p>
        </div>
        <button onclick="window.app.start()" class="px-10 h-12 sf-accent-btn rounded-lg font-bold text-sm shadow-xl shadow-[var(--accent)]/20">Launch Workspace</button>
    </div>

    <!-- MAIN INTERFACE -->
    <div id="app-container" class="hidden h-full w-full flex flex-col overflow-hidden">
        
        <!-- TOP MENU BAR -->
        <header class="h-10 bg-[var(--bg-secondary)] border-b border-[var(--border)] flex items-center justify-between px-3 z-50">
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-2">
                    <div class="w-5 h-5 bg-[var(--accent)] rounded-sm flex items-center justify-center">
                        <i data-lucide="box" class="w-3.5 h-3.5 text-white"></i>
                    </div>
                    <span class="font-bold text-[11px] tracking-tight">ShapeForge 3D</span>
                </div>
                <nav class="hidden md:flex items-center gap-1">
                    <div class="relative menu-item"><button class="px-2 py-1 text-[10px] hover:bg-[var(--border)] rounded">File</button></div>
                    <div class="relative menu-item"><button class="px-2 py-1 text-[10px] hover:bg-[var(--border)] rounded">Edit</button></div>
                    <div class="relative menu-item"><button class="px-2 py-1 text-[10px] hover:bg-[var(--border)] rounded">View</button></div>
                    <div class="relative menu-item"><button class="px-2 py-1 text-[10px] hover:bg-[var(--border)] rounded">Create</button></div>
                </nav>
            </div>
            <div class="flex items-center gap-2">
                <button class="sf-btn w-7 h-7" title="Undo"><i data-lucide="undo-2" class="w-3.5"></i></button>
                <button class="sf-btn w-7 h-7" title="Redo"><i data-lucide="redo-2" class="w-3.5"></i></button>
                <button class="sf-btn w-7 h-7" title="Layers"><i data-lucide="layers" class="w-3.5"></i></button>
            </div>
        </header>

        <div class="flex-grow flex overflow-hidden">
            <!-- SIDEBAR -->
            <aside class="sf-sidebar flex flex-col items-center py-3 gap-3 z-40">
                <button id="tool-select" class="sf-btn active" onclick="window.app.setTool('select')"><i data-lucide="mouse-pointer-2" class="w-4"></i></button>
                <button id="tool-translate" class="sf-btn" onclick="window.app.setTool('translate')"><i data-lucide="move" class="w-4"></i></button>
                <button id="tool-rotate" class="sf-btn" onclick="window.app.setTool('rotate')"><i data-lucide="rotate-cw" class="w-4"></i></button>
                <button id="tool-scale" class="sf-btn" onclick="window.app.setTool('scale')"><i data-lucide="maximize" class="w-4"></i></button>
                <div class="w-6 h-[1px] bg-[var(--border)] my-1"></div>
                <button class="sf-btn"><i data-lucide="hammer" class="w-4"></i></button>
                <button class="sf-btn mt-auto text-[var(--danger)]" onclick="window.app.deleteSelected()"><i data-lucide="trash-2" class="w-4"></i></button>
            </aside>

            <!-- VIEWPORT -->
            <main id="viewport-container">
                <div class="mode-selector">
                    <button class="mode-btn active" id="mode-object">Object</button>
                    <button class="mode-btn" id="mode-vertex">Vertex</button>
                    <button class="mode-btn" id="mode-edge">Edge</button>
                    <button class="mode-btn" id="mode-face">Face</button>
                </div>
            </main>

            <!-- INSPECTOR -->
            <aside class="sf-inspector flex flex-col bg-[var(--bg-secondary)]">
                <div class="flex border-b border-[var(--border)] shrink-0">
                    <button class="flex-1 py-2 text-[9px] font-bold uppercase tracking-widest border-b-2 border-[var(--accent)]">Hierarchy</button>
                    <button class="flex-1 py-2 text-[9px] font-bold uppercase tracking-widest text-[var(--text-secondary)]">Properties</button>
                    <button class="flex-1 py-2 text-[9px] font-bold uppercase tracking-widest text-[var(--text-secondary)]">Materials</button>
                </div>
                <div class="p-3">
                    <div class="flex items-center justify-between text-[9px] font-bold text-[var(--text-secondary)] uppercase mb-3">
                        <span>Scene Graph</span>
                        <i data-lucide="search" class="w-3"></i>
                    </div>
                    <ul id="scene-tree" class="space-y-1">
                        <!-- Populated by JS -->
                    </ul>
                </div>
            </aside>
        </div>

        <!-- TIMELINE -->
        <div id="timeline-panel">
            <div class="timeline-header">
                <div class="flex items-center gap-1">
                    <button class="sf-btn w-6 h-6"><i data-lucide="skip-back" class="w-3"></i></button>
                    <button class="sf-btn w-7 h-7 active"><i data-lucide="play" class="w-3"></i></button>
                    <button class="sf-btn w-6 h-6"><i data-lucide="square" class="w-3"></i></button>
                    <button class="sf-btn w-6 h-6"><i data-lucide="skip-forward" class="w-3"></i></button>
                </div>
                <div class="w-px h-3 bg-[var(--border)] mx-1"></div>
                <button class="h-6 px-2 bg-[var(--accent)]/10 border border-[var(--accent)]/40 rounded flex items-center gap-1.5 text-[9px] font-bold text-[var(--accent)]">
                    <i data-lucide="key" class="w-3"></i> Keyframe
                </button>
                <div class="flex items-center gap-2 text-[9px] font-bold text-[var(--text-secondary)] ml-2">
                    <input type="checkbox" checked class="accent-[var(--accent)]"> AUTO KEY
                </div>
                <div class="flex-grow"></div>
                <div class="flex items-center gap-4 text-[9px] font-mono">
                    <div class="flex items-center gap-1.5"><span class="opacity-40">FPS</span> <span class="text-white">30</span></div>
                    <div class="flex items-center gap-1.5"><span class="opacity-40">SEC</span> <span class="text-white">5</span></div>
                    <div class="bg-[var(--bg-primary)] px-2 py-0.5 rounded border border-[var(--border)] flex items-center gap-2">
                        <span class="opacity-40 uppercase">Frame</span> <span class="text-[var(--accent)] font-bold">0</span>
                    </div>
                </div>
            </div>
            <div class="timeline-content">
                <div class="timeline-tracks"></div>
                <div class="timeline-grid">
                    <div class="playhead" style="left: 40px;"></div>
                    <div class="absolute inset-0 opacity-10" style="background-image: linear-gradient(to right, var(--border) 1px, transparent 1px); background-size: 20px 100%;"></div>
                </div>
            </div>
        </div>

        <!-- FOOTER -->
        <footer class="app-footer flex items-center justify-between px-3 text-[8px] font-bold uppercase tracking-widest text-[var(--text-secondary)]">
            <div class="flex gap-4">
                <span id="poly-count">Polygons: 12</span>
                <span id="vert-count">Vertices: 24</span>
                <span class="text-[var(--success)]">Mode: Normal Studio</span>
            </div>
            <div class="opacity-60">
                SF v0.9.4 PWA
            </div>
        </footer>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { TransformControls } from 'three/addons/controls/TransformControls.js';

        class ShapeForgeApp {
            constructor() {
                this.container = document.getElementById('viewport-container');
                this.objects = new Map();
                this.selected = null;
                
                this.initEngine();
                this.setupLights();
                this.setupControls();
                this.animate();

                window.addEventListener('resize', () => this.onWindowResize());
                lucide.createIcons();

                // PWA Service Worker Registration Simulation
                if ('serviceWorker' in navigator) {
                    window.addEventListener('load', () => {
                        console.log("PWA: Service Worker ready for registration.");
                    });
                }
            }

            initEngine() {
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x05070a);
                
                this.camera = new THREE.PerspectiveCamera(50, 1, 0.1, 1000);
                this.camera.position.set(5, 5, 5);
                this.camera.lookAt(0, 0, 0);

                this.renderer = new THREE.WebGLRenderer({ 
                    antialias: true,
                    alpha: true,
                    powerPreference: "high-performance" 
                });
                this.container.appendChild(this.renderer.domElement);

                // Add Grid
                const grid = new THREE.GridHelper(20, 20, 0x273149, 0x151C29);
                this.scene.add(grid);
            }

            setupLights() {
                const ambient = new THREE.AmbientLight(0xffffff, 0.5);
                this.scene.add(ambient);

                const sun = new THREE.DirectionalLight(0xffffff, 1.2);
                sun.position.set(5, 10, 5);
                this.scene.add(sun);
            }

            setupControls() {
                this.orbit = new OrbitControls(this.camera, this.renderer.domElement);
                this.orbit.enableDamping = true;
                this.orbit.dampingFactor = 0.05;

                this.transform = new TransformControls(this.camera, this.renderer.domElement);
                this.scene.add(this.transform);

                this.transform.addEventListener('dragging-changed', (event) => {
                    this.orbit.enabled = !event.value;
                });
            }

            start() {
                document.getElementById('welcome-screen').style.display = 'none';
                document.getElementById('app-container').classList.remove('hidden');
                
                this.onWindowResize();
                this.addObject('box');
            }

            addObject(type) {
                const geo = new THREE.BoxGeometry(1.5, 1.5, 1.5);
                const mat = new THREE.MeshStandardMaterial({ 
                    color: 0x7C83FF,
                    roughness: 0.4,
                    metalness: 0.2
                });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.name = "Primary Box";
                mesh.userData.id = Math.random().toString(36).substr(2, 9);
                
                this.scene.add(mesh);
                this.objects.set(mesh.userData.id, mesh);
                this.selectObject(mesh);
                this.updateHierarchy();
            }

            selectObject(obj) {
                this.selected = obj;
                if (obj) {
                    this.transform.attach(obj);
                } else {
                    this.transform.detach();
                }
                this.updateHierarchy();
            }

            setTool(mode) {
                this.transform.setMode(mode);
                document.querySelectorAll('.sf-sidebar .sf-btn').forEach(btn => btn.classList.remove('active'));
                document.getElementById(`tool-${mode}`).classList.add('active');
            }

            deleteSelected() {
                if (!this.selected) return;
                this.scene.remove(this.selected);
                this.objects.delete(this.selected.userData.id);
                this.selectObject(null);
            }

            updateHierarchy() {
                const list = document.getElementById('scene-tree');
                list.innerHTML = '';
                this.objects.forEach(obj => {
                    const li = document.createElement('li');
                    li.className = `flex items-center gap-2 p-1.5 rounded cursor-pointer text-[10px] ${this.selected === obj ? 'bg-[var(--accent)] text-white' : 'hover:bg-[var(--border)] text-[var(--text-secondary)]'}`;
                    li.innerHTML = `<i data-lucide="box" class="w-3"></i> ${obj.name}`;
                    li.onclick = () => this.selectObject(obj);
                    list.appendChild(li);
                });
                lucide.createIcons();
            }

            onWindowResize() {
                const w = this.container.clientWidth;
                const h = this.container.clientHeight;
                this.camera.aspect = w / h;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(w, h);
                this.renderer.setPixelRatio(window.devicePixelRatio);
            }

            animate() {
                requestAnimationFrame(() => this.animate());
                this.orbit.update();
                this.renderer.render(this.scene, this.camera);
            }
        }

        window.app = new ShapeForgeApp();
    </script>
    
    <footer class="fixed bottom-0 left-0 right-0 pointer-events-none z-[100] flex justify-center pb-1">
        <div class="text-[8px] text-[var(--text-secondary)] opacity-50 bg-black/40 px-2 py-0.5 rounded-full backdrop-blur-sm">
            Built: PWA support and Web App Icon. Next: Asset library and material shaders.
        </div>
    </footer>
</body>
</html>
