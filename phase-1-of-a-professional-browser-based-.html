<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ShapeForge 3D Studio - PWA Edition</title>
    
    <!-- PWA / Mobile Web App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#080B12">
    <meta name="mobile-web-app-capable" content="yes">
    
    <!-- Web App Icon (SVG Data URI) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='128' fill='%23080B12'/%3E%3Cpath d='M256 120 L400 200 L400 360 L256 440 L112 360 L112 200 Z' fill='none' stroke='%237C83FF' stroke-width='30'/%3E%3Cpath d='M256 120 L256 280 L400 360 M256 280 L112 360' fill='none' stroke='%237C83FF' stroke-width='20' opacity='0.6'/%3E%3C/svg%3E">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        :root {
            --bg-primary: #080B12;
            --bg-secondary: #0E131D;
            --panel: #151C29;
            --border: #273149;
            --text-primary: #F2F5FF;
            --text-secondary: #8D98AE;
            --accent: #7C83FF;
            --accent-glow: rgba(124, 131, 255, 0.4);
            --danger: #FF4757;
            --warning: #FFB86C;
            --success: #50FA7B;
            --timeline-height: 160px;
        }

        * {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            box-sizing: border-box;
            user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            overscroll-behavior: none;
            touch-action: manipulation;
        }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: var(--bg-primary); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

        .sf-panel { background: var(--panel); border: 1px solid var(--border); }

        .sf-btn {
            height: 38px;
            min-width: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            transition: all 0.2s ease;
            cursor: pointer;
            color: var(--text-secondary);
            border: 1px solid transparent;
        }
        .sf-btn:active { transform: scale(0.92); background: var(--border); }
        .sf-btn.active { background: var(--accent); color: white; border-color: var(--accent-glow); box-shadow: 0 0 10px var(--accent-glow); }

        .sf-accent-btn { background: var(--accent); color: white; border: none; }
        
        .sf-sidebar { width: 52px; flex-shrink: 0; border-right: 1px solid var(--border); background: var(--bg-secondary); }
        .sf-inspector { width: 260px; flex-shrink: 0; border-left: 1px solid var(--border); }

        #viewport-container {
            flex-grow: 1;
            position: relative;
            background: #000;
            touch-action: none;
            overflow: hidden;
        }

        .mode-selector {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            background: rgba(14, 19, 29, 0.85);
            border: 1px solid var(--border);
            padding: 4px;
            border-radius: 8px;
            backdrop-filter: blur(12px);
            z-index: 100;
        }

        .mode-btn {
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-secondary);
            transition: 0.2s;
        }
        .mode-btn.active { background: var(--accent); color: white; }

        #timeline-panel {
            height: var(--timeline-height);
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            z-index: 100;
        }

        .timeline-header {
            height: 40px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 12px;
            gap: 12px;
            font-size: 10px;
        }

        .timeline-content { flex-grow: 1; display: flex; overflow: hidden; position: relative; }
        .timeline-tracks { width: 140px; border-right: 1px solid var(--border); background: var(--bg-primary); }
        .timeline-grid { flex-grow: 1; overflow-x: auto; background: var(--bg-primary); position: relative; }

        .playhead {
            position: absolute;
            top: 0; bottom: 0;
            width: 2px;
            background: var(--danger);
            z-index: 20;
            pointer-events: none;
        }

        .app-footer { background: var(--bg-primary); border-top: 1px solid var(--border); height: 28px; }

        @media (max-width: 768px) {
            .sf-inspector { display: none; }
            .sf-sidebar { 
                position: absolute; 
                bottom: calc(var(--timeline-height) + 16px); 
                left: 16px;
                height: auto;
                background: rgba(21, 28, 41, 0.9);
                backdrop-filter: blur(12px);
                border-radius: 10px;
                border: 1px solid var(--border);
                width: 48px;
                padding: 6px 0;
            }
        }

        /* Fixed Click states for touch devices */
        button, .sf-btn, .mode-btn {
            pointer-events: auto !important;
        }
    </style>
</head>
<body>

    <!-- LOADING / WELCOME SCREEN -->
    <div id="welcome-screen" class="fixed inset-0 z-[9999] bg-[var(--bg-primary)] flex flex-col items-center justify-center p-8 text-center">
        <div class="mb-10 flex flex-col items-center">
            <div class="w-24 h-24 mb-6 bg-[var(--panel)] border-2 border-[var(--accent)] rounded-2xl flex items-center justify-center shadow-[0_0_40px_rgba(124,131,255,0.3)]">
                <i data-lucide="box" class="w-12 h-12 text-[var(--accent)]"></i>
            </div>
            <h1 class="text-4xl font-black tracking-tighter mb-1 italic">SHAPE<span class="text-[var(--accent)]">FORGE</span> 3D</h1>
            <p class="text-[var(--text-secondary)] text-[10px] uppercase tracking-[0.4em]">Professional Mobile Studio</p>
        </div>
        <button onclick="window.app.start()" class="px-12 h-14 sf-accent-btn rounded-xl font-bold text-base shadow-2xl shadow-[var(--accent)]/30 active:scale-95 transition-transform">
            Launch Workspace
        </button>
    </div>

    <!-- MAIN INTERFACE -->
    <div id="app-container" class="hidden h-full w-full flex flex-col overflow-hidden">
        
        <!-- TOP MENU BAR -->
        <header class="h-12 bg-[var(--bg-secondary)] border-b border-[var(--border)] flex items-center justify-between px-4 z-[200]">
            <div class="flex items-center gap-5">
                <div class="flex items-center gap-2">
                    <div class="w-6 h-6 bg-[var(--accent)] rounded-md flex items-center justify-center">
                        <i data-lucide="box" class="w-4 h-4 text-white"></i>
                    </div>
                    <span class="font-bold text-[12px] tracking-tight">ShapeForge 3D</span>
                </div>
                <nav class="hidden md:flex items-center gap-2">
                    <button class="px-2 py-1 text-[11px] hover:text-white transition" onclick="alert('File Menu')">File</button>
                    <button class="px-2 py-1 text-[11px] hover:text-white transition" onclick="alert('Edit Menu')">Edit</button>
                    <button class="px-2 py-1 text-[11px] hover:text-white transition" onclick="alert('View Menu')">View</button>
                    <button class="px-2 py-1 text-[11px] hover:text-white transition" onclick="alert('Create Menu')">Create</button>
                </nav>
            </div>
            <div class="flex items-center gap-3">
                <button class="sf-btn w-8 h-8" title="Undo" onclick="console.log('Undo')"><i data-lucide="undo-2" class="w-4"></i></button>
                <button class="sf-btn w-8 h-8" title="Redo" onclick="console.log('Redo')"><i data-lucide="redo-2" class="w-4"></i></button>
                <button class="sf-btn w-8 h-8" title="Layers" onclick="alert('Layers list')"><i data-lucide="layers" class="w-4"></i></button>
            </div>
        </header>

        <div class="flex-grow flex overflow-hidden relative">
            <!-- SIDEBAR -->
            <aside class="sf-sidebar flex flex-col items-center py-4 gap-4 z-[150]">
                <button id="tool-select" class="sf-btn active" onclick="window.app.setTool('select')"><i data-lucide="mouse-pointer-2" class="w-5"></i></button>
                <button id="tool-translate" class="sf-btn" onclick="window.app.setTool('translate')"><i data-lucide="move" class="w-5"></i></button>
                <button id="tool-rotate" class="sf-btn" onclick="window.app.setTool('rotate')"><i data-lucide="rotate-cw" class="w-5"></i></button>
                <button id="tool-scale" class="sf-btn" onclick="window.app.setTool('scale')"><i data-lucide="maximize" class="w-5"></i></button>
                <div class="w-8 h-[1px] bg-[var(--border)] my-1"></div>
                <button class="sf-btn" onclick="window.app.addObject('box')"><i data-lucide="plus" class="w-5"></i></button>
                <button class="sf-btn mt-auto text-[var(--danger)]" onclick="window.app.deleteSelected()"><i data-lucide="trash-2" class="w-5"></i></button>
            </aside>

            <!-- VIEWPORT -->
            <main id="viewport-container">
                <div class="mode-selector">
                    <button class="mode-btn active" onclick="window.app.setEditMode('object', this)">Object</button>
                    <button class="mode-btn" onclick="window.app.setEditMode('vertex', this)">Vertex</button>
                    <button class="mode-btn" onclick="window.app.setEditMode('edge', this)">Edge</button>
                    <button class="mode-btn" onclick="window.app.setEditMode('face', this)">Face</button>
                </div>
            </main>

            <!-- INSPECTOR -->
            <aside class="sf-inspector flex flex-col bg-[var(--bg-secondary)] z-[150]">
                <div class="flex border-b border-[var(--border)] shrink-0">
                    <button id="tab-hierarchy" onclick="window.app.switchTab('hierarchy')" class="flex-1 py-3 text-[10px] font-bold uppercase tracking-widest border-b-2 border-[var(--accent)]">Hierarchy</button>
                    <button id="tab-properties" onclick="window.app.switchTab('properties')" class="flex-1 py-3 text-[10px] font-bold uppercase tracking-widest text-[var(--text-secondary)]">Properties</button>
                </div>
                <div id="inspector-content" class="p-4 flex-grow overflow-y-auto">
                    <div class="flex items-center justify-between text-[10px] font-bold text-[var(--text-secondary)] uppercase mb-4">
                        <span>Scene Graph</span>
                        <i data-lucide="search" class="w-3.5"></i>
                    </div>
                    <ul id="scene-tree" class="space-y-1.5">
                        <!-- Populated by JS -->
                    </ul>
                </div>
            </aside>
        </div>

        <!-- TIMELINE -->
        <div id="timeline-panel">
            <div class="timeline-header">
                <div class="flex items-center gap-1.5">
                    <button class="sf-btn w-7 h-7" onclick="window.app.timelineControl('back')"><i data-lucide="skip-back" class="w-4"></i></button>
                    <button id="play-btn" class="sf-btn w-9 h-9 active" onclick="window.app.timelineControl('play')"><i data-lucide="play" class="w-4"></i></button>
                    <button class="sf-btn w-7 h-7" onclick="window.app.timelineControl('stop')"><i data-lucide="square" class="w-4"></i></button>
                    <button class="sf-btn w-7 h-7" onclick="window.app.timelineControl('forward')"><i data-lucide="skip-forward" class="w-4"></i></button>
                </div>
                <div class="w-px h-4 bg-[var(--border)] mx-1"></div>
                <button class="h-8 px-3 bg-[var(--accent)]/10 border border-[var(--accent)]/40 rounded-lg flex items-center gap-2 text-[10px] font-bold text-[var(--accent)] active:scale-95" onclick="console.log('Keyframe added')">
                    <i data-lucide="key" class="w-3.5"></i> Keyframe
                </button>
                <div class="flex items-center gap-2 text-[10px] font-bold text-[var(--text-secondary)] ml-2">
                    <input type="checkbox" checked class="w-4 h-4 accent-[var(--accent)]" id="auto-key"> <label for="auto-key">AUTO KEY</label>
                </div>
                <div class="flex-grow"></div>
                <div class="flex items-center gap-5 text-[10px] font-mono">
                    <div class="flex items-center gap-1.5"><span class="opacity-40 uppercase">Fps</span> <span class="text-white">30</span></div>
                    <div class="flex items-center gap-1.5"><span class="opacity-40 uppercase">Sec</span> <span class="text-white">5</span></div>
                    <div class="bg-[var(--bg-primary)] px-3 py-1 rounded-md border border-[var(--border)] flex items-center gap-2">
                        <span class="opacity-40 uppercase">Frame</span> <span class="text-[var(--accent)] font-bold" id="current-frame">0</span>
                    </div>
                </div>
            </div>
            <div class="timeline-content">
                <div class="timeline-tracks flex flex-col p-2 gap-2">
                    <div class="h-6 w-full bg-[var(--panel)] rounded-sm border border-[var(--border)] opacity-50"></div>
                    <div class="h-6 w-full bg-[var(--panel)] rounded-sm border border-[var(--border)] opacity-50"></div>
                </div>
                <div class="timeline-grid">
                    <div id="playhead" class="playhead" style="left: 0px;"></div>
                    <div class="absolute inset-0 opacity-10 pointer-events-none" style="background-image: linear-gradient(to right, var(--border) 1px, transparent 1px); background-size: 30px 100%;"></div>
                </div>
            </div>
        </div>

        <!-- FOOTER -->
        <footer class="app-footer flex items-center justify-between px-4 text-[9px] font-bold uppercase tracking-widest text-[var(--text-secondary)]">
            <div class="flex gap-6">
                <span id="poly-count">Polys: 12</span>
                <span id="vert-count">Verts: 24</span>
                <span class="text-[var(--success)]" id="smart-status">Mode: Balanced Normal</span>
            </div>
            <div class="opacity-50">
                SF v0.9.5-PRO
            </div>
        </footer>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { TransformControls } from 'three/addons/controls/TransformControls.js';

        class ShapeForgeApp {
            constructor() {
                this.container = document.getElementById('viewport-container');
                this.objects = new Map();
                this.selected = null;
                this.isPlaying = false;
                this.currentFrame = 0;
                
                this.initEngine();
                this.setupLights();
                this.setupControls();
                this.animate();

                window.addEventListener('resize', () => this.onWindowResize());
                lucide.createIcons();
            }

            initEngine() {
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x05070a);
                
                this.camera = new THREE.PerspectiveCamera(50, 1, 0.1, 1000);
                this.camera.position.set(6, 6, 6);
                this.camera.lookAt(0, 0, 0);

                this.renderer = new THREE.WebGLRenderer({ 
                    antialias: true,
                    alpha: true,
                    powerPreference: "high-performance" 
                });
                this.container.appendChild(this.renderer.domElement);

                const grid = new THREE.GridHelper(30, 30, 0x273149, 0x151C29);
                this.scene.add(grid);
            }

            setupLights() {
                this.scene.add(new THREE.AmbientLight(0xffffff, 0.6));
                const sun = new THREE.DirectionalLight(0xffffff, 1.5);
                sun.position.set(10, 20, 10);
                this.scene.add(sun);
            }

            setupControls() {
                this.orbit = new OrbitControls(this.camera, this.renderer.domElement);
                this.orbit.enableDamping = true;
                this.orbit.dampingFactor = 0.08;

                this.transform = new TransformControls(this.camera, this.renderer.domElement);
                this.scene.add(this.transform);

                this.transform.addEventListener('dragging-changed', (event) => {
                    this.orbit.enabled = !event.value;
                });
            }

            start() {
                document.getElementById('welcome-screen').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('welcome-screen').style.display = 'none';
                    document.getElementById('app-container').classList.remove('hidden');
                    this.onWindowResize();
                    this.addObject('box');
                }, 300);
            }

            addObject(type) {
                const geo = new THREE.BoxGeometry(2, 2, 2);
                const mat = new THREE.MeshStandardMaterial({ 
                    color: 0x7C83FF,
                    roughness: 0.3,
                    metalness: 0.2
                });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.name = `Box_${Math.floor(Math.random() * 1000)}`;
                mesh.userData.id = Math.random().toString(36).substr(2, 9);
                
                this.scene.add(mesh);
                this.objects.set(mesh.userData.id, mesh);
                this.selectObject(mesh);
                this.updateHierarchy();
            }

            selectObject(obj) {
                this.selected = obj;
                if (obj) {
                    this.transform.attach(obj);
                } else {
                    this.transform.detach();
                }
                this.updateHierarchy();
            }

            setTool(mode) {
                this.transform.setMode(mode);
                document.querySelectorAll('.sf-sidebar .sf-btn').forEach(btn => btn.classList.remove('active'));
                const toolBtn = document.getElementById(`tool-${mode}`);
                if (toolBtn) toolBtn.classList.add('active');
            }

            setEditMode(mode, el) {
                document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
                el.classList.add('active');
                console.log("Switching to", mode, "mode");
                document.getElementById('smart-status').innerText = `Mode: Balanced ${mode.toUpperCase()}`;
            }

            deleteSelected() {
                if (!this.selected) return;
                this.scene.remove(this.selected);
                this.objects.delete(this.selected.userData.id);
                this.selectObject(null);
            }

            switchTab(tab) {
                const tabs = ['hierarchy', 'properties'];
                tabs.forEach(t => {
                    const btn = document.getElementById(`tab-${t}`);
                    btn.classList.toggle('border-[var(--accent)]', t === tab);
                    btn.classList.toggle('text-[var(--text-secondary)]', t !== tab);
                });
                console.log("Inspector Tab:", tab);
            }

            timelineControl(action) {
                const playBtn = document.getElementById('play-btn');
                if (action === 'play') {
                    this.isPlaying = !this.isPlaying;
                    playBtn.innerHTML = this.isPlaying ? '<i data-lucide="pause" class="w-4"></i>' : '<i data-lucide="play" class="w-4"></i>';
                    playBtn.classList.toggle('active', this.isPlaying);
                    lucide.createIcons();
                } else if (action === 'stop') {
                    this.isPlaying = false;
                    this.currentFrame = 0;
                    playBtn.innerHTML = '<i data-lucide="play" class="w-4"></i>';
                    playBtn.classList.remove('active');
                    this.updateTimelineUI();
                    lucide.createIcons();
                }
            }

            updateTimelineUI() {
                const frameEl = document.getElementById('current-frame');
                const playhead = document.getElementById('playhead');
                frameEl.innerText = Math.floor(this.currentFrame);
                playhead.style.left = `${(this.currentFrame * 3) % 100}%`;
            }

            updateHierarchy() {
                const list = document.getElementById('scene-tree');
                list.innerHTML = '';
                this.objects.forEach(obj => {
                    const li = document.createElement('li');
                    li.className = `flex items-center gap-2 px-3 py-2 rounded-lg cursor-pointer text-[11px] transition-colors ${this.selected === obj ? 'bg-[var(--accent)] text-white shadow-lg' : 'hover:bg-[var(--border)] text-[var(--text-secondary)]'}`;
                    li.innerHTML = `<i data-lucide="box" class="w-3.5"></i> <span>${obj.name}</span>`;
                    li.onclick = (e) => {
                        e.stopPropagation();
                        this.selectObject(obj);
                    };
                    list.appendChild(li);
                });
                lucide.createIcons();
            }

            onWindowResize() {
                const w = this.container.clientWidth;
                const h = this.container.clientHeight;
                this.camera.aspect = w / h;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(w, h);
                this.renderer.setPixelRatio(window.devicePixelRatio);
            }

            animate() {
                requestAnimationFrame(() => this.animate());
                if (this.isPlaying) {
                    this.currentFrame = (this.currentFrame + 0.5) % 150;
                    this.updateTimelineUI();
                }
                this.orbit.update();
                this.renderer.render(this.scene, this.camera);
            }
        }

        window.app = new ShapeForgeApp();
    </script>
    
    <footer class="fixed bottom-0 left-0 right-0 pointer-events-none z-[1000] flex justify-center pb-2">
        <div class="text-[9px] text-[var(--text-secondary)] opacity-60 bg-black/50 px-3 py-1 rounded-full backdrop-blur-md border border-white/5">
            Built: Balanced event handling for all UI buttons. Next: Keyframe interpolation and asset library.
        </div>
    </footer>
</body>
</html>
