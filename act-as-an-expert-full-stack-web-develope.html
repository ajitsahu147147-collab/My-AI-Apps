<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Anim3D - Precise Sculpt</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
        html, body { 
            overscroll-behavior: none; 
            touch-action: none; 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            background: #0f172a;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        canvas { display: block; touch-action: none; margin: auto; }
        .glass { background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .active-tool { background-color: #3b82f6 !important; transform: scale(1.05); box-shadow: 0 0 15px rgba(59, 130, 246, 0.4); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        #viewport-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .dimension-label {
            position: absolute;
            pointer-events: none;
            background: rgba(0,0,0,0.6);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            color: #fbbf24;
            white-space: nowrap;
            z-index: 5;
        }

        .precision-panel {
            max-height: 60vh;
            overflow-y: auto;
        }
    </style>
</head>
<body class="fixed inset-0 overflow-hidden flex flex-col">

    <!-- Top Toolbar -->
    <header class="glass absolute top-0 w-full z-20 p-3 flex justify-between items-center safe-top">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-blue-600 rounded flex items-center justify-center">
                <i data-lucide="ruler" class="w-5 h-5 text-white"></i>
            </div>
            <div>
                <h1 class="font-bold text-sm tracking-tight leading-none">Anim3D Precision</h1>
                <span id="coordDisplay" class="text-[10px] text-slate-400">0.0, 0.0, 0.0</span>
            </div>
        </div>
        <div class="flex gap-2">
            <select id="aspectRatio" onchange="updateViewport()" class="bg-slate-800 text-[10px] px-2 py-1 rounded border border-slate-700">
                <option value="fill">Fill Screen</option>
                <option value="16:9">16:9</option>
                <option value="1:1">1:1</option>
                <option value="4:3">4:3</option>
            </select>
            <button onclick="toggleSettings()" class="p-2 bg-slate-800 rounded-full">
                <i data-lucide="settings" class="w-4 h-4 text-slate-300"></i>
            </button>
        </div>
    </header>

    <!-- Measurement Labels Overlay -->
    <div id="labelContainer" class="absolute inset-0 pointer-events-none z-10"></div>

    <!-- Precision Sidebar -->
    <aside id="precisionSidebar" class="absolute left-4 top-20 z-20 flex flex-col gap-3 w-12 hover:w-48 group transition-all duration-300">
        <div class="glass p-2 rounded-2xl flex flex-col gap-3 overflow-hidden">
            <!-- Stroke Weight -->
            <div class="flex flex-col gap-1 px-1">
                <div class="flex justify-between items-center opacity-0 group-hover:opacity-100 transition-opacity">
                    <span class="text-[10px] uppercase font-bold text-slate-400">Weight</span>
                    <span id="weightVal" class="text-[10px] text-blue-400">2.0</span>
                </div>
                <input type="range" id="strokeWeight" min="0.1" max="5.0" step="0.1" value="0.2" oninput="updateBrushSettings()" class="w-full h-1 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-blue-500">
            </div>

            <div class="h-px bg-slate-700 mx-1"></div>

            <!-- View Toggles -->
            <div class="grid grid-cols-1 group-hover:grid-cols-2 gap-2 transition-all">
                <button onclick="setCameraView('perspective')" class="view-btn p-2 bg-slate-800 rounded-lg active-tool" title="Perspective">
                    <i data-lucide="box" class="w-5 h-5"></i>
                </button>
                <button onclick="setCameraView('top')" class="view-btn p-2 bg-slate-800 rounded-lg" title="Top View">
                    <i data-lucide="layout-template" class="w-5 h-5"></i>
                </button>
                <button onclick="setCameraView('front')" class="view-btn p-2 bg-slate-800 rounded-lg" title="Front View">
                    <i data-lucide="monitor" class="w-5 h-5"></i>
                </button>
                <button onclick="setCameraView('iso')" class="view-btn p-2 bg-slate-800 rounded-lg" title="Isometric">
                    <i data-lucide="layers" class="w-5 h-5"></i>
                </button>
            </div>

            <div class="h-px bg-slate-700 mx-1"></div>

            <!-- Snapping & Units -->
            <button id="snapBtn" onclick="toggleSnap()" class="p-2 bg-slate-800 rounded-lg flex items-center gap-3">
                <i data-lucide="magnet" class="w-5 h-5 text-slate-400"></i>
                <span class="text-xs hidden group-hover:inline">Snap to Grid</span>
            </button>
            
            <button id="unitBtn" onclick="toggleUnits()" class="p-2 bg-slate-800 rounded-lg flex items-center gap-3">
                <i data-lucide="milestone" class="w-5 h-5 text-slate-400"></i>
                <span id="unitText" class="text-xs hidden group-hover:inline">Metric (m)</span>
            </button>
        </div>

        <div class="glass p-2 rounded-2xl flex flex-col gap-2">
            <button id="drawBtn" onclick="setMode('draw')" class="p-2 bg-slate-800 rounded-lg active-tool">
                <i data-lucide="pencil" class="w-5 h-5"></i>
            </button>
            <button id="orbitBtn" onclick="setMode('orbit')" class="p-2 bg-slate-800 rounded-lg">
                <i data-lucide="move" class="w-5 h-5"></i>
            </button>
            <button onclick="clearFrame()" class="p-2 bg-slate-800 rounded-lg text-red-400">
                <i data-lucide="trash-2" class="w-5 h-5"></i>
            </button>
        </div>
    </aside>

    <!-- Canvas -->
    <main id="viewport-container" class="bg-slate-900">
        <div id="viewport"></div>
    </main>

    <!-- Footer Controls -->
    <footer class="glass absolute bottom-0 w-full z-20 safe-bottom">
        <div class="px-4 py-2 flex items-center gap-4">
            <div class="flex items-center gap-3">
                <button onclick="togglePlay()" id="playBtn" class="w-10 h-10 bg-white text-slate-900 rounded-full flex items-center justify-center">
                    <i data-lucide="play" class="w-5 h-5 fill-current"></i>
                </button>
            </div>
            <div id="timeline" class="flex-grow flex gap-2 overflow-x-auto no-scrollbar py-1"></div>
            <button onclick="addFrame()" class="w-8 h-8 bg-slate-800 rounded flex items-center justify-center border border-dashed border-slate-600">
                <i data-lucide="plus" class="w-4 h-4"></i>
            </button>
        </div>
        
        <div class="px-4 py-1 text-[10px] text-center text-slate-500 border-t border-white/5">
            Built: Precise dimensions, scaling, and orthographic views. Next: Parametric shape primitives.
        </div>
    </footer>

    <script>
        const state = {
            mode: 'draw',
            frames: [[]],
            currentFrame: 0,
            isPlaying: false,
            fps: 12,
            gridSize: 1.0,
            snapEnabled: false,
            unitSystem: 'metric', // 'metric' or 'pixels'
            brushSize: 0.2,
            aspectRatio: 'fill',
            cameraType: 'perspective',
            pressureEnabled: true
        };

        let scene, camera, orthoCamera, activeCamera, renderer, controls, gridHelper;
        let currentStroke = null;
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();
        let drawingPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
        let intersectionPoint = new THREE.Vector3();
        let lastPoint = new THREE.Vector3();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a);

            const aspect = window.innerWidth / window.innerHeight;
            camera = new THREE.PerspectiveCamera(75, aspect, 0.1, 1000);
            camera.position.set(5, 5, 8);

            const d = 10;
            orthoCamera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 0.1, 1000);
            orthoCamera.position.set(0, 10, 0);
            orthoCamera.lookAt(0,0,0);
            
            activeCamera = camera;

            renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('viewport').appendChild(renderer.domElement);

            const ambient = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambient);
            const directional = new THREE.DirectionalLight(0xffffff, 0.6);
            directional.position.set(10, 20, 10);
            scene.add(directional);

            controls = new THREE.OrbitControls(activeCamera, renderer.domElement);
            controls.enableDamping = true;
            controls.enabled = false;

            updateGrid();
            
            window.addEventListener('resize', updateViewport);
            renderer.domElement.addEventListener('pointerdown', onDown);
            renderer.domElement.addEventListener('pointermove', onMove);
            renderer.domElement.addEventListener('pointerup', onUp);

            renderTimeline();
            animate();
        }

        function updateGrid() {
            if (gridHelper) scene.remove(gridHelper);
            gridHelper = new THREE.GridHelper(40, 40 / state.gridSize, 0x334155, 0x1e293b);
            scene.add(gridHelper);
        }

        function toggleSnap() {
            state.snapEnabled = !state.snapEnabled;
            document.getElementById('snapBtn').classList.toggle('active-tool', state.snapEnabled);
        }

        function toggleUnits() {
            state.unitSystem = state.unitSystem === 'metric' ? 'pixels' : 'metric';
            document.getElementById('unitText').innerText = state.unitSystem === 'metric' ? 'Metric (m)' : 'Pixels (px)';
        }

        function setCameraView(view) {
            state.cameraType = view;
            const aspect = renderer.domElement.width / renderer.domElement.height;
            const d = 10;

            document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active-tool'));
            
            if (view === 'perspective') {
                activeCamera = camera;
                controls.object = camera;
            } else {
                activeCamera = orthoCamera;
                controls.object = orthoCamera;
                
                if (view === 'top') orthoCamera.position.set(0, d, 0);
                if (view === 'front') orthoCamera.position.set(0, 0, d);
                if (view === 'side') orthoCamera.position.set(d, 0, 0);
                if (view === 'iso') orthoCamera.position.set(d, d, d);
                
                orthoCamera.lookAt(0, 0, 0);
            }
            activeCamera.updateProjectionMatrix();
            controls.reset();
        }

        function updateViewport() {
            const container = document.getElementById('viewport-container');
            const style = getComputedStyle(container);
            const containerW = parseInt(style.width);
            const containerH = parseInt(style.height);
            
            state.aspectRatio = document.getElementById('aspectRatio').value;
            
            let w = containerW, h = containerH;
            if (state.aspectRatio === '16:9') h = w / (16/9);
            if (state.aspectRatio === '1:1') w = h = Math.min(containerW, containerH);
            if (state.aspectRatio === '4:3') h = w / (4/3);

            if (h > containerH) {
                h = containerH;
                if (state.aspectRatio === '16:9') w = h * (16/9);
                if (state.aspectRatio === '4:3') w = h * (4/3);
            }

            renderer.setSize(w, h);
            const aspect = w / h;
            camera.aspect = aspect;
            camera.updateProjectionMatrix();

            const d = 10;
            orthoCamera.left = -d * aspect;
            orthoCamera.right = d * aspect;
            orthoCamera.top = d;
            orthoCamera.bottom = -d;
            orthoCamera.updateProjectionMatrix();
        }

        function onDown(e) {
            if (state.mode !== 'draw') return;
            updateMousePos(e);
            
            raycaster.setFromCamera(mouse, activeCamera);
            // Dynamic plane based on camera view
            const normal = new THREE.Vector3();
            activeCamera.getWorldDirection(normal);
            drawingPlane.setFromNormalAndCoplanarPoint(normal.negate(), new THREE.Vector3(0,0,0));

            if (raycaster.ray.intersectPlane(drawingPlane, intersectionPoint)) {
                if (state.snapEnabled) snapVector(intersectionPoint);
                startStroke(intersectionPoint.clone(), e.pressure || 0.5);
            }
        }

        function onMove(e) {
            updateMousePos(e);
            raycaster.setFromCamera(mouse, activeCamera);
            
            if (raycaster.ray.intersectPlane(drawingPlane, intersectionPoint)) {
                if (state.snapEnabled) snapVector(intersectionPoint);
                
                document.getElementById('coordDisplay').innerText = 
                    `${intersectionPoint.x.toFixed(2)}, ${intersectionPoint.y.toFixed(2)}, ${intersectionPoint.z.toFixed(2)}`;

                if (state.mode === 'draw' && currentStroke) {
                    addPoint(intersectionPoint.clone(), e.pressure || 0.5);
                }
            }
        }

        function onUp() {
            if (currentStroke) {
                state.frames[state.currentFrame].push(currentStroke);
                currentStroke = null;
                document.getElementById('labelContainer').innerHTML = '';
            }
        }

        function updateMousePos(e) {
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
        }

        function snapVector(v) {
            v.x = Math.round(v.x / state.gridSize) * state.gridSize;
            v.y = Math.round(v.y / state.gridSize) * state.gridSize;
            v.z = Math.round(v.z / state.gridSize) * state.gridSize;
        }

        function startStroke(pt, pressure) {
            const color = '#3b82f6'; // Fixed or from UI
            const radius = state.brushSize * (0.2 + pressure);
            currentStroke = {
                points: [pt],
                pressures: [pressure],
                mesh: null,
                color: color
            };
            lastPoint.copy(pt);
        }

        function addPoint(pt, pressure) {
            const dist = pt.distanceTo(lastPoint);
            if (dist < 0.05) return;

            currentStroke.points.push(pt);
            currentStroke.pressures.push(pressure);
            lastPoint.copy(pt);

            if (currentStroke.mesh) scene.remove(currentStroke.mesh);
            
            if (currentStroke.points.length > 1) {
                const curve = new THREE.CatmullRomCurve3(currentStroke.points);
                // Simplify: uniform radius for the tube, or varied if using custom geometry
                const avgPressure = currentStroke.pressures.reduce((a,b)=>a+b, 0) / currentStroke.pressures.length;
                const geo = new THREE.TubeGeometry(curve, currentStroke.points.length * 3, state.brushSize * (0.5 + avgPressure), 8, false);
                const mat = new THREE.MeshStandardMaterial({ color: currentStroke.color, roughness: 0.4 });
                currentStroke.mesh = new THREE.Mesh(geo, mat);
                scene.add(currentStroke.mesh);
                
                updateMeasureLabel(pt, dist);
            }
        }

        function updateMeasureLabel(pos, distance) {
            const container = document.getElementById('labelContainer');
            container.innerHTML = '';
            
            const vector = pos.clone().project(activeCamera);
            const x = (vector.x * 0.5 + 0.5) * renderer.domElement.width;
            const y = (-vector.y * 0.5 + 0.5) * renderer.domElement.height;
            
            const label = document.createElement('div');
            label.className = 'dimension-label';
            label.style.left = `${x}px`;
            label.style.top = `${y}px`;
            
            let val = distance;
            let unit = 'm';
            if (state.unitSystem === 'pixels') {
                val = distance * 100;
                unit = 'px';
            }
            
            label.innerText = `${val.toFixed(2)}${unit}`;
            container.appendChild(label);
        }

        function setMode(mode) {
            state.mode = mode;
            controls.enabled = (mode === 'orbit');
            document.getElementById('drawBtn').classList.toggle('active-tool', mode === 'draw');
            document.getElementById('orbitBtn').classList.toggle('active-tool', mode === 'orbit');
        }

        function updateBrushSettings() {
            state.brushSize = parseFloat(document.getElementById('strokeWeight').value);
            document.getElementById('weightVal').innerText = state.brushSize.toFixed(1);
        }

        function animate() {
            requestAnimationFrame(animate);
            if (controls.enabled) controls.update();
            renderer.render(scene, activeCamera);
        }

        function clearFrame() {
            state.frames[state.currentFrame].forEach(s => scene.remove(s.mesh));
            state.frames[state.currentFrame] = [];
        }

        function addFrame() {
            state.frames.push([]);
            state.currentFrame = state.frames.length - 1;
            renderTimeline();
            refreshScene();
        }

        function selectFrame(idx) {
            state.currentFrame = idx;
            renderTimeline();
            refreshScene();
        }

        function refreshScene() {
            scene.children = scene.children.filter(c => c.isLight || c === gridHelper);
            state.frames[state.currentFrame].forEach(s => scene.add(s.mesh));
        }

        function renderTimeline() {
            const container = document.getElementById('timeline');
            container.innerHTML = '';
            state.frames.forEach((f, i) => {
                const b = document.createElement('button');
                b.className = `w-10 h-10 shrink-0 rounded flex items-center justify-center text-[10px] font-bold ${i === state.currentFrame ? 'bg-blue-600' : 'bg-slate-800'}`;
                b.innerText = i + 1;
                b.onclick = () => selectFrame(i);
                container.appendChild(b);
            });
        }

        let loop;
        function togglePlay() {
            state.isPlaying = !state.isPlaying;
            const btn = document.getElementById('playBtn');
            if (state.isPlaying) {
                btn.innerHTML = '<i data-lucide="pause" class="w-5 h-5 fill-current"></i>';
                loop = setInterval(() => {
                    state.currentFrame = (state.currentFrame + 1) % state.frames.length;
                    renderTimeline();
                    refreshScene();
                }, 1000 / state.fps);
            } else {
                btn.innerHTML = '<i data-lucide="play" class="w-5 h-5 fill-current"></i>';
                clearInterval(loop);
            }
            lucide.createIcons();
        }

        init();
        lucide.createIcons();
    </script>
</body>
</html>
<!-- 
Built: Precise dimensions, scaling, and orthographic views. Next: Parametric shape primitives.
--></html>
