<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Anim3D - Mobile Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; box-sizing: border-box; }
        html, body { 
            overscroll-behavior: none; 
            touch-action: none; 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            background: #0f172a;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }
        
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100dvh;
            z-index: 0;
        }

        .ui-overlay {
            position: fixed;
            z-index: 10;
            pointer-events: none;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        .ui-overlay > * { pointer-events: auto; }

        .glass-panel { 
            background: rgba(30, 41, 59, 0.7); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08); 
        }

        .tool-active { 
            background-color: #3b82f6 !important; 
            color: white !important;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
        }

        /* Vertical Slider Styling */
        input[type=range].vertical-slider {
            writing-mode: bt-lr; /* IE */
            -webkit-appearance: slider-vertical; /* WebKit */
            width: 8px;
            height: 120px;
            padding: 0 5px;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .frame-node {
            min-width: 64px;
            height: 64px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            transition: all 0.2s;
            border: 2px solid transparent;
        }
        .frame-node.active {
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.1);
        }

        .dimension-label {
            position: absolute;
            pointer-events: none;
            background: rgba(15, 23, 42, 0.8);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            color: #3b82f6;
            white-space: nowrap;
            z-index: 5;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>
    <div id="label-container" class="fixed inset-0 pointer-events-none z-[5]"></div>

    <div class="ui-overlay">
        <!-- Top Bar -->
        <header class="flex justify-between items-center p-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center shadow-lg">
                    <i data-lucide="box" class="w-6 h-6 text-white"></i>
                </div>
                <h1 class="text-xl font-bold tracking-tight">Anim3D</h1>
            </div>
            <div class="flex gap-2">
                <button onclick="undo()" class="w-10 h-10 glass-panel rounded-full flex items-center justify-center opacity-60 hover:opacity-100">
                    <i data-lucide="undo-2" class="w-5 h-5"></i>
                </button>
                <button onclick="toggleFullscreen()" class="w-10 h-10 glass-panel rounded-full flex items-center justify-center bg-blue-600/20 text-blue-400">
                    <i data-lucide="maximize" class="w-5 h-5"></i>
                </button>
            </div>
        </header>

        <!-- Main Body Area -->
        <div class="flex-grow flex items-center px-4 relative">
            <!-- Left Toolbar -->
            <aside class="glass-panel w-16 py-6 rounded-[2rem] flex flex-col items-center gap-6 shadow-2xl">
                <!-- Color Indicator -->
                <div class="w-8 h-8 bg-blue-500 rounded-lg shadow-inner"></div>
                
                <!-- Brush Size Slider -->
                <div class="flex flex-col items-center gap-2">
                    <div class="w-px h-4 bg-slate-600"></div>
                    <input type="range" id="brushSize" min="0.05" max="1.5" step="0.01" value="0.2" class="vertical-slider accent-blue-500" oninput="updateBrushSettings()">
                    <div class="w-px h-4 bg-slate-600"></div>
                </div>

                <!-- Drawing Tools -->
                <button id="drawBtn" onclick="setMode('draw')" class="w-10 h-10 rounded-xl flex items-center justify-center transition-all tool-active">
                    <i data-lucide="pencil" class="w-5 h-5"></i>
                </button>
                <button id="orbitBtn" onclick="setMode('orbit')" class="w-10 h-10 rounded-xl flex items-center justify-center transition-all text-slate-400">
                    <i data-lucide="move-3d" class="w-5 h-5"></i>
                </button>

                <div class="w-8 h-px bg-slate-700/50"></div>

                <button onclick="toggleGrid()" class="w-10 h-10 rounded-xl flex items-center justify-center text-slate-400">
                    <i data-lucide="grid-3x3" class="w-5 h-5"></i>
                </button>
            </aside>
        </div>

        <!-- Bottom Timeline Area -->
        <footer class="p-6">
            <div class="glass-panel p-4 rounded-[2.5rem] flex items-center gap-4 shadow-2xl">
                <!-- Play Control -->
                <button onclick="togglePlay()" id="playBtn" class="w-14 h-14 bg-white text-slate-900 rounded-full flex items-center justify-center shadow-lg active:scale-95 transition-transform">
                    <i data-lucide="play" class="w-7 h-7 fill-current translate-x-0.5"></i>
                </button>

                <!-- FPS selector -->
                <div class="flex flex-col items-start px-2">
                    <span class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">FPS</span>
                    <select onchange="state.fps = parseInt(this.value)" class="bg-transparent text-sm font-bold outline-none cursor-pointer">
                        <option value="12" class="bg-slate-800">12 ▾</option>
                        <option value="24" class="bg-slate-800">24 ▾</option>
                        <option value="30" class="bg-slate-800">30 ▾</option>
                    </select>
                </div>

                <div class="w-px h-10 bg-slate-700/50 mx-2"></div>

                <!-- Horizontal Timeline -->
                <div id="timeline" class="flex-grow flex gap-3 overflow-x-auto no-scrollbar py-2">
                    <!-- Frames injected here -->
                </div>

                <!-- Add Frame -->
                <button onclick="addFrame()" class="w-14 h-14 border-2 border-dashed border-slate-600 rounded-2xl flex items-center justify-center text-slate-500 hover:border-blue-500 hover:text-blue-500 transition-colors">
                    <i data-lucide="plus" class="w-6 h-6"></i>
                </button>
            </div>
        </footer>
    </div>

    <!-- Status Note -->
    <div class="fixed bottom-1 w-full text-center pointer-events-none z-20">
        <p class="text-[9px] text-slate-500 font-medium">Built: 3D Frame-by-frame sketching engine. Next: Vertex manipulation and audio sync.</p>
    </div>

    <script>
        const state = {
            mode: 'draw',
            frames: [[]],
            currentFrame: 0,
            isPlaying: false,
            fps: 12,
            brushSize: 0.2,
            gridVisible: true
        };

        let scene, camera, renderer, controls, gridHelper;
        let currentStroke = null;
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();
        let drawingPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
        let intersectionPoint = new THREE.Vector3();
        let lastPoint = new THREE.Vector3();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a);

            const container = document.getElementById('canvas-container');
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(5, 5, 10);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            const ambient = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambient);
            const directional = new THREE.DirectionalLight(0xffffff, 0.5);
            directional.position.set(10, 20, 10);
            scene.add(directional);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.enabled = false;

            gridHelper = new THREE.GridHelper(50, 50, 0x1e293b, 0x1e293b);
            scene.add(gridHelper);
            
            window.addEventListener('resize', onWindowResize);
            renderer.domElement.addEventListener('pointerdown', onDown);
            renderer.domElement.addEventListener('pointermove', onMove);
            renderer.domElement.addEventListener('pointerup', onUp);

            renderTimeline();
            animate();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function setMode(mode) {
            state.mode = mode;
            controls.enabled = (mode === 'orbit');
            document.getElementById('drawBtn').classList.toggle('tool-active', mode === 'draw');
            document.getElementById('drawBtn').classList.toggle('text-slate-400', mode !== 'draw');
            document.getElementById('orbitBtn').classList.toggle('tool-active', mode === 'orbit');
            document.getElementById('orbitBtn').classList.toggle('text-slate-400', mode !== 'orbit');
        }

        function onDown(e) {
            if (state.mode !== 'draw') return;
            updateMousePos(e);
            
            raycaster.setFromCamera(mouse, camera);
            const normal = new THREE.Vector3();
            camera.getWorldDirection(normal);
            drawingPlane.setFromNormalAndCoplanarPoint(normal.negate(), new THREE.Vector3(0,0,0));

            if (raycaster.ray.intersectPlane(drawingPlane, intersectionPoint)) {
                startStroke(intersectionPoint.clone(), e.pressure || 0.5);
            }
        }

        function onMove(e) {
            updateMousePos(e);
            if (state.mode === 'draw' && currentStroke) {
                raycaster.setFromCamera(mouse, camera);
                if (raycaster.ray.intersectPlane(drawingPlane, intersectionPoint)) {
                    addPoint(intersectionPoint.clone(), e.pressure || 0.5);
                }
            }
        }

        function onUp() {
            if (currentStroke) {
                state.frames[state.currentFrame].push(currentStroke);
                currentStroke = null;
                document.getElementById('label-container').innerHTML = '';
            }
        }

        function updateMousePos(e) {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        }

        function startStroke(pt, pressure) {
            currentStroke = {
                points: [pt],
                mesh: null,
                color: '#3b82f6'
            };
            lastPoint.copy(pt);
        }

        function addPoint(pt, pressure) {
            if (pt.distanceTo(lastPoint) < 0.1) return;
            currentStroke.points.push(pt);
            lastPoint.copy(pt);

            if (currentStroke.mesh) scene.remove(currentStroke.mesh);
            
            if (currentStroke.points.length > 1) {
                const curve = new THREE.CatmullRomCurve3(currentStroke.points);
                const geo = new THREE.TubeGeometry(curve, currentStroke.points.length * 2, state.brushSize, 8, false);
                const mat = new THREE.MeshStandardMaterial({ color: currentStroke.color, roughness: 0.3, metalness: 0.2 });
                currentStroke.mesh = new THREE.Mesh(geo, mat);
                scene.add(currentStroke.mesh);
            }
        }

        function addFrame() {
            state.frames.push([]);
            selectFrame(state.frames.length - 1);
        }

        function selectFrame(idx) {
            state.currentFrame = idx;
            refreshScene();
            renderTimeline();
        }

        function refreshScene() {
            // Remove current meshes
            scene.children = scene.children.filter(c => {
                const isStroke = c.type === 'Mesh' && !c.isLight;
                if(isStroke) scene.remove(c);
                return !isStroke;
            });
            // Add frames
            state.frames[state.currentFrame].forEach(s => scene.add(s.mesh));
        }

        function renderTimeline() {
            const container = document.getElementById('timeline');
            container.innerHTML = '';
            state.frames.forEach((f, i) => {
                const div = document.createElement('div');
                div.className = `frame-node glass-panel ${i === state.currentFrame ? 'active' : 'opacity-40'}`;
                div.innerText = i + 1;
                div.onclick = () => selectFrame(i);
                container.appendChild(div);
            });
            // Scroll to end
            container.scrollTo({ left: container.scrollWidth, behavior: 'smooth' });
        }

        function togglePlay() {
            state.isPlaying = !state.isPlaying;
            const btn = document.getElementById('playBtn');
            if (state.isPlaying) {
                btn.innerHTML = '<i data-lucide="pause" class="w-7 h-7 fill-current"></i>';
                state.playInterval = setInterval(() => {
                    state.currentFrame = (state.currentFrame + 1) % state.frames.length;
                    refreshScene();
                    renderTimeline();
                }, 1000 / state.fps);
            } else {
                btn.innerHTML = '<i data-lucide="play" class="w-7 h-7 fill-current translate-x-0.5"></i>';
                clearInterval(state.playInterval);
            }
            lucide.createIcons();
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(e => console.log(e));
            } else {
                document.exitFullscreen();
            }
        }

        function toggleGrid() {
            state.gridVisible = !state.gridVisible;
            gridHelper.visible = state.gridVisible;
        }

        function updateBrushSettings() {
            state.brushSize = parseFloat(document.getElementById('brushSize').value);
        }

        function undo() {
            if (state.frames[state.currentFrame].length > 0) {
                const stroke = state.frames[state.currentFrame].pop();
                scene.remove(stroke.mesh);
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            if (controls.enabled) controls.update();
            renderer.render(scene, camera);
        }

        init();
        lucide.createIcons();
    </script>
</body>
</html>
<!-- 
Built: 3D Frame-by-frame sketching engine. Next: Vertex manipulation and audio sync.
--></html>
